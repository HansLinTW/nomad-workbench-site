<body data-c="#0E6B5A">
<div class="app">
  <nav class="side" id="side" aria-label="主選單">
    <div class="brand"><div class="mk">勞</div><div><b>勞報單簽核</b><span id="coName"></span></div></div>
  </nav>
  <main class="main"><div id="licbar"></div><div id="main"><div class="loading"><span class="spin"></span>載入中…</div></div></main>

<div id="toast" class="toast hide" role="status"><span id="toastMsg"></span><button type="button" data-act="closeToast" aria-label="關閉通知">×</button></div>

<script>
var MAX_AMOUNT = 9999999;
var CATEGORY_OPTIONS = ["50 薪資(兼職)","9A 執行業務","9B 稿費/講演","92 其他所得"];
function userError_(msg) {
  var e = new Error(msg);
  e.userFacing = true;
  return e;
}
function formatMoney_(n) {
  return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function pad2_(n) { return (n < 10 ? '0' : '') + n; }
function ymd_(v) {
  if (v === null || v === undefined || v === '') return '';
  if (Object.prototype.toString.call(v) === '[object Date]') {
    if (isNaN(v.getTime())) return '';
    if (typeof Utilities !== 'undefined') return Utilities.formatDate(v, tz_(), 'yyyy-MM-dd');
    return v.getFullYear() + '-' + pad2_(v.getMonth() + 1) + '-' + pad2_(v.getDate());
  }
  var m = String(v).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m ? m[1] + '-' + pad2_(Number(m[2])) + '-' + pad2_(Number(m[3])) : '';
}
function constValue_(consts, name, date) {
  var best = null;
  consts.forEach(function (c) {
    if (c.name === name && c.from <= date && (!best || c.from > best.from)) best = c;
  });
  if (!best) throw new Error('扣繳常數缺少「' + name + '」在 ' + date + ' 的值');
  return best.value;
}
function evalThreshold_(expr, consts, date) {
  expr = String(expr || '').replace(/[,，\s]/g, '').replace(/[×xX＊]/g, '*');
  if (expr === '') return 0;
  if (/^\d+(\.\d+)?$/.test(expr)) return Number(expr);
  var m = expr.match(/^([^*]+)\*(\d+(\.\d+)?)$/);
  if (m) return Math.round(constValue_(consts, m[1], date) * Number(m[2]));
  return constValue_(consts, expr, date);
}
function taxOf_(amount, rateBp) { return Math.floor(amount * rateBp / 10000); }
function suppOf_(base, rateBp) { return Math.floor((base * rateBp + 5000) / 10000); }
function condHolds_(rule, amount, threshold) {
  switch (rule.cond) {
    case '給付額>=': return amount >= threshold;
    case '給付額>': return amount > threshold;
    case '給付額<=': return amount <= threshold;
    case '給付額<': return amount < threshold;
    case '稅額>': return taxOf_(amount, rule.rateBp) > threshold;
    case '一律': return true;
    case '免扣': return true;
    default: throw new Error('規則 ' + rule.id + ' 的條件「' + rule.cond + '」無法辨識');
  }
}
function pickRule_(rules, consts, item, category, resident, date, amount) {
  var target = resident ? '居住者' : '非居住者';
  for (var i = 0; i < rules.length; i++) {
    var r = rules[i];
    if (r.item !== item) continue;
    if (date < r.from || date > r.to) continue;
    if (r.cats.indexOf(category) < 0) continue;
    if (r.target !== '全部' && r.target !== target) continue;
    var th = evalThreshold_(r.threshold, consts, date);
    if (condHolds_(r, amount, th)) return r;
  }
  return null;
}
function categoryCode_(text, fallback) {
  var s = String(text || '').trim().toUpperCase();
  var m = s.match(/^(50|9A|9B|92)/);
  if (m) return m[1];
  if (/稿費|講演|演講|版稅/.test(s)) return '9B';
  if (/執行業務/.test(s)) return '9A';
  if (/其他所得/.test(s)) return '92';
  if (/薪資|兼職/.test(s)) return '50';
  var f = String(fallback || '50').trim().toUpperCase().slice(0, 2);
  return ['50', '9A', '9B', '92'].indexOf(f) >= 0 ? f : '50';
}
function categoryLabel_(code) {
  for (var i = 0; i < CATEGORY_OPTIONS.length; i++) {
    if (CATEGORY_OPTIONS[i].indexOf(code + ' ') === 0) return CATEGORY_OPTIONS[i];
  }
  return code;
}
function suppExemptReason_(exemption, category, amount, nhiInsured, consts, date) {
  if (nhiInsured === false) return '未參加全民健保';
  var isPro = category === '9A' || category === '9B';
  switch (exemption) {
    case '在本公司投保': return category === '50' ? '在本公司投保' : '';
    case '無投保資格':
    case '低收入戶':
    case '職業工會投保': return exemption;
    case '專技人員自行執業': return isPro ? exemption : '';
    case '弱勢身分': return isPro && amount < constValue_(consts, '最低工資', date) ? '弱勢身分未達最低工資' : '';
    default: return '';
  }
}
function calcWithholding_(input, rules, consts) {
  var amount = Math.floor(Number(input.amount));
  if (!(amount >= 1 && amount <= MAX_AMOUNT)) throw userError_('所得金額須為 1 ~ ' + formatMoney_(MAX_AMOUNT) + ' 的整數。');
  var cat = input.category;
  var date = input.date;
  var resident = input.resident !== false;
  var notes = [];

  var taxRule = pickRule_(rules, consts, '所得稅', cat, resident, date, amount);
  var tax = taxRule && taxRule.cond !== '免扣' ? taxOf_(amount, taxRule.rateBp) : 0;

  var supp = 0, suppRule = null;
  var reason = suppExemptReason_(input.exemption || '', cat, amount, input.nhiInsured, consts, date);
  if (reason) {
    notes.push('補充保費免扣：' + reason);
  } else {
    suppRule = pickRule_(rules, consts, '補充保費', cat, resident, date, amount);
    if (suppRule && suppRule.cond !== '免扣') {
      var base = suppRule.cap ? Math.min(amount, suppRule.cap) : amount;
      supp = suppOf_(base, suppRule.rateBp);
    }
  }

  return {
    category: cat,
    resident: resident,
    date: date,
    amount: amount,
    tax: tax,
    taxRateBp: taxRule ? taxRule.rateBp : 0,
    taxRule: taxRule ? taxRule.id : '',
    supp: supp,
    suppRateBp: suppRule ? suppRule.rateBp : 0,
    suppRule: suppRule ? suppRule.id : '',
    net: amount - tax - supp,
    ruleText: cat + (resident ? '・居住者' : '・非居住者') + '・' + date.slice(0, 4) + '｜' +
      (taxRule ? taxRule.id : '無') + ' / ' + (suppRule ? suppRule.id : (reason ? '免扣' : '無')),
    notes: notes
  };
}
</script>
<script>
(function () {
  'use strict';
  /* 主色：由公司設定的色碼推出深色與淡色，整頁一致 */
  function setBrand(hex) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return;
    var n = parseInt(hex.slice(1), 16), rgb = [n >> 16 & 255, n >> 8 & 255, n & 255];
    var mix = function (t, w) { return 'rgb(' + rgb.map(function (c) { return Math.round(c * (1 - w) + t * w); }).join(',') + ')'; };
    var R = document.documentElement.style;
    R.setProperty('--c', hex); R.setProperty('--c2', mix(0, .2));
    R.setProperty('--tint', mix(255, .88)); R.setProperty('--tint2', mix(255, .95)); R.setProperty('--cdark', mix(0, .35));
  }
  setBrand(document.body.getAttribute('data-c'));

  /* ================= 共用 ================= */
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return formatMoney_(n); };

          '<div class="row"><button type="button" class="btn pri" data-act="upApply" data-v="' + esc(u.latest.version) + '">開始更新</button><button type="button" class="btn" data-act="upAsk" data-v="">取消</button></div></div>'
        : '<div class="row"><button type="button" class="btn pri lg" data-act="upAsk" data-v="apply">更新到 v' + esc(u.latest.version) + '</button></div>';
    } else if (u.available) {
      h += '<div class="note bad"><b>這份系統目前無法一鍵更新。</b>' + esc(u.api ? u.api.message : '') + '</div>' +
        '<div class="row"><button type="button" class="btn" data-act="upPkg">下載更新包（手動更新）</button></div>';
    }
    h += '</section>';
    if (u.last) {
      h += '<section class="card" style="display:flex;flex-direction:column;gap:12px;padding:24px">' +
        '<h2>上次更新</h2><dl class="kv"><dt>版本</dt><dd>v' + esc(u.last.from || '?') + ' → v' + esc(u.last.version) + (u.last.rolledBack ? '（回復）' : '') + '</dd>' +
        '<dt>時間</dt><dd>' + esc(u.last.finishedAt || u.last.at || '') + '</dd><dt>執行者</dt><dd>' + esc(u.last.finishedBy || u.last.by || '—') + '</dd></dl>' +
        (u.last.backupId && !u.last.rolledBack ? (T.upAsk === 'rollback'
          ? '<div class="note warn" style="display:flex;flex-direction:column;gap:10px">回復會把程式換回 v' + esc(u.last.from) + '，並切換兩個部署。資料不受影響。<div class="row"><button type="button" class="btn danger" data-act="upRollback">確定回復</button><button type="button" class="btn" data-act="upAsk" data-v="">取消</button></div></div>'
          : '<div><button type="button" class="btn" data-act="upAsk" data-v="rollback">回復到 v' + esc(u.last.from) + '</button></div>') : '') +
        '</section>';
    }
    h += '<section class="card" style="display:flex;flex-direction:column;gap:8px;padding:24px"><h2>一鍵更新的條件</h2>' +
      '<p class="small" style="margin:0">' + (u.api && u.api.ok ? '✓ 已完成設定，可以一鍵更新。' : '需要部署者完成一次性設定（系統供應商通常會在安裝時代為設定）：') + '</p>' +
      (u.api && u.api.ok ? '' : '<ol class="small" style="margin:0;padding-left:20px;line-height:1.9"><li>Apps Script 專案連結標準 Google Cloud 專案，並在該專案啟用 Apps Script API</li>' +
        '<li>部署者在 <a href="https://script.google.com/home/usersettings" target="_blank" rel="noopener">Apps Script 使用者設定</a> 開啟「Google Apps Script API」</li><li>公司設定填好兩個部署網址</li></ol>') +
      '<p class="xs muted" style="margin:0">部署：' + (u.targets.length ? u.targets.map(function (t) { return esc(t.label) + '（' + esc(t.id) + '）'; }).join('、') : '未設定') +
      (u.deployer ? '；部署者：' + esc(u.deployer) : '') + '</p></section>';
    $('#st-body').innerHTML = h;
  }
  function downloadB64(name, b64, mime) {
    var a = document.createElement('a');
    a.href = 'data:' + mime + ';base64,' + b64; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function renderLogs() {
    var T = S.st;
    $('#st-body').innerHTML = '<section class="card" style="display:flex;flex-direction:column;gap:14px;margin-top:18px">' +
      '<div class="row" style="justify-content:space-between;gap:12px"><div class="chips" role="group" aria-label="依層級篩選" id="lg-lv"></div>' +
      '<div style="flex:0 1 300px;display:flex"><label for="lg-q" class="sr">搜尋日誌</label><input id="lg-q" type="search" data-in="lgQ" value="' + esc(T.q) + '" placeholder="輸入錯誤代碼或單號" style="min-height:40px"></div></div>' +
      '<div class="tblw" id="lg-table"></div><p class="xs muted" style="margin:0">顯示最近 300 筆。查修時可在「公司資料 › 日誌層級」改成 DEBUG，查完請改回 INFO。</p></section>';
    updateLogs();
  }
  function updateLogs() {
    var T = S.st;
    $('#lg-lv').innerHTML = [['all', '全部'], ['ERROR', 'ERROR'], ['WARN', 'WARN'], ['INFO', 'INFO'], ['DEBUG', 'DEBUG']].map(function (l) {
      return '<button type="button" class="chipbtn' + (T.level === l[0] ? ' on' : '') + '" aria-pressed="' + (T.level === l[0]) + '" data-act="lgLv" data-v="' + l[0] + '" style="min-height:36px;font-size:13px">' + l[1] + '</button>';
    }).join('');
    var q = T.q.trim().toLowerCase();
    var rows = T.logs.filter(function (g) { return (T.level === 'all' || g.level === T.level) && (!q || (g.code + g.slip + g.msg).toLowerCase().indexOf(q) >= 0); });
    $('#lg-table').innerHTML = rows.length ? '<table class="t" style="min-width:880px;font-size:13px"><thead><tr><th>時間</th><th>層級</th><th>代碼</th><th>來源 · 單號</th><th>步驟</th><th>訊息</th></tr></thead><tbody>' +
      rows.map(function (g, i) {
        var c = LV[g.level] || LV.INFO, open = !!T.open[g.code + i];
        return '<tr><td class="num" style="white-space:nowrap">' + esc(g.t) + '</td><td><span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(g.level) + '</span></td>' +
          '<td class="num">' + esc(g.code) + '</td><td>' + esc(g.src) + '<div class="num muted">' + esc(g.slip) + '</div></td><td>' + esc(g.step) + '</td>' +
          '<td>' + esc(g.msg) + (g.detail ? '<div><button type="button" class="btn sm" style="margin-top:4px" aria-expanded="' + open + '" data-act="lgOpen" data-k="' + esc(g.code + i) + '">' + (open ? '收合' : '詳細') + '</button></div>' + (open ? '<pre class="log">' + esc(g.detail) + '</pre>' : '') : '') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="muted" style="margin:0;padding:24px;text-align:center">沒有符合條件的日誌</p>';
  }

  /* ================= 事件 ================= */
  var ACT = {
    closeToast: function () { $('#toast').classList.add('hide'); },
    go: function (el) {
      var o = {};
      if (el.dataset.tab) o.tab = el.dataset.tab;
      if (el.dataset.sel) o.sel = el.dataset.sel;
      if (el.dataset.pid) o.pid = el.dataset.pid;
      if (el.dataset.reset) o.reset = true;
      go(el.dataset.to, o);
    },
    copy: function (el) { var inp = document.getElementById(el.dataset.in); if (inp) copyText(inp.value, inp); },
    dashResend: function (el) {
      busy(el, true);
      api('adm_action', el.dataset.id, 'return').then(function (r) {
        toast('已發新連結' + (r.emailed ? '並寄到 ' + r.email : '，請到單據頁複製連結傳給所得人'));
        viewDash();
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    // 開單
    nfTab: function (el) { S.nf.tab = el.dataset.v; renderNew(); },
    nfPick: function (el) { var p = S.boot.payees.filter(function (x) { return x.pid === el.dataset.pid; })[0]; S.nf.pid = p.pid; S.nf.q = p.name; S.nf.send = null; $('#nf-q').value = p.name; updateNew(); },
    nfUnpick: function () { S.nf.pid = null; updateNew(); var q = $('#nf-q'); q.focus(); q.select(); },
    nfReset: function () { S.nf = freshNF(); renderNew(); },
    nfBatchAgain: function () { S.nf.batchResult = null; S.nf.batchText = ''; S.nf.batchPick = {}; renderNew(); },
    nfSubmit: function (el) {
      var f = S.nf, st = nfState(), send = el.dataset.send === '1';
      var item = { name: st.picked ? st.picked.name : st.q, pid: f.pid || '', amount: st.amount, cat: f.cat, incomeDate: f.incomeDate, payDate: f.payDate, note: f.note, memo: f.memo };
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="nfSubmit"]'), function (b) { b.disabled = true; });
      busy(el, true, send ? '建立並發送中…' : '儲存中…');
      var p;
      if (f.editId) {
        p = api('adm_updateDraft', f.editId, item).then(function (s) {
          if (!send) return { id: s.id, name: s.name, amount: s.amount, net: s.net, sent: false };
          return api('adm_action', s.id, f._send === 'link' ? 'link' : 'send').then(function (r) {
            return { id: s.id, name: s.name, amount: r.slip.amount, net: r.slip.net, sent: true, emailed: r.emailed, email: r.email, link: r.link, expire: slash(r.slip.expire) };
          });
        });
      } else {
        p = api('adm_createSlips', [item], { send: send, mode: f._send }).then(function (res) { return res[0]; });
      }
      p.then(function (r) { S.nf.result = r; renderNew(); toast(r.sent ? (r.emailed ? '已建立並寄出填寫連結' : '已建立，請把連結傳給所得人') : '已存成草稿'); })
        .catch(function (e) { busy(el, false); updateNew(); fail(e); });
    },
    nbSubmit: function (el) {
      var send = el.dataset.send === '1';
      var rows = batchRows();
      var items = rows.map(function (r) { return { name: r.name, pid: r.who ? r.who.pid : '', amount: r.amount, cat: r.cat, note: r.note }; });
      busy(el, true, '建立中，約需 ' + Math.max(5, rows.length * 3) + ' 秒…');
      api('adm_createSlips', items, { send: send, mode: 'email' }).then(function (res) {
        S.nf.batchResult = res; renderNew(); toast('已建立 ' + res.length + ' 張');
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    // 單據
    slTab: function (el) { S.sl.tab = el.dataset.v; updateSlips(); },
    slOpen: function (el) { openSlip(el.dataset.id); },
    slCheck: function (el) { S.sl.checked[el.dataset.id] = el.checked; updateSlips(); },
    slAll: function (el) { (S.sl.visible || []).forEach(function (id) { S.sl.checked[id] = el.checked; }); updateSlips(); },
    slClear: function () { S.sl.checked = {}; updateSlips(); },
    slAct: function (el) { slipDo(el.dataset.v, el); },
    slDo: function (el) { slipDo(el.dataset.v, el); },
    slCancel: function () { S.sl.confirm = ''; renderSlipDetail(); },
    slBulkPay: function (el) {
      var ids = S.sl.list.filter(function (x) { return S.sl.checked[x.id] && x.status === '已簽署'; }).map(function (x) { return x.id; });
      busy(el, true);
      api('adm_markPaid', ids).then(function (r) {
        toast('已標記 ' + r.done + ' 張已撥款；已寄帳務通知給 ' + r.mailed + ' 位所得人' + (r.done > r.mailed ? '（' + (r.done - r.mailed) + ' 位沒有 Email）' : ''));
        S.sl.checked = {};
        return loadSlips().then(function () { updateSlips(); if (S.sl.sel) openSlip(S.sl.sel); });
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    // 所得人
    pyF: function (el) { S.py.filter = el.dataset.v; updatePayees(); },
    pyOpen: function (el) { openPayee(el.dataset.pid); },
    pySaveEx: function (el) {
      var d = S.py.detail;
      busy(el, true);
      api('adm_setExempt', d.pid, $('#py-ex').value, $('#py-exd').value).then(function () {
        toast('已儲存 ' + d.name + ' 的補充保費免扣身分');
        return api('adm_payees').then(function (list) { S.py.list = list; updatePayees(); openPayee(d.pid, true); });
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    // 設定
    stTab: function (el) { S.st.tab = el.dataset.v; S.st.confirm = ''; renderSettings(); renderLicBar(); },
    csColor: function (el) { $('#cs-color').value = el.dataset.v; Array.prototype.forEach.call(document.querySelectorAll('.sw'), function (b) { var on = b.dataset.v === el.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }); },
    lwCheck: function (el) {
      busy(el, true, '驗證中…');
      api('adm_checkLicense', $('#lw-key').value).then(function (v) {
        if (v.ok) { toast('授權有效，正在進入後台'); MAIN.innerHTML = loading(); boot(); }
        else { renderLicenseWall(v.message); toast(v.message, true); }
      }).catch(function (e) { busy(el, false); if (e && e.license) renderLicenseWall(e.message); else fail(e); });
    },
    upAsk: function (el) { S.st.upAsk = el.dataset.v; renderUpdate(); },
    upApply: function (el) {
      busy(el, true, '更新中…');
      api('adm_updateApply', el.dataset.v).then(function (d) {
        d.info.api = S.st.up.api; S.st.up = d.info; S.st.upDone = d.result; S.st.upAsk = '';
        if (S.boot.update) S.boot.update.available = false;
        renderUpdate(); renderLicBar();
        toast(d.result.needAuth ? '程式已寫入，請完成授權' : '已更新到 v' + d.result.version, !!d.result.needAuth);
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    upRollback: function (el) {
      busy(el, true, '回復中…');
      api('adm_updateRollback').then(function (d) {
        d.info.api = S.st.up.api; S.st.up = d.info; S.st.upDone = { version: d.result.version }; S.st.upAsk = '';
        renderUpdate(); toast('已回復到 v' + d.result.version);
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    upPkg: function (el) {
      busy(el, true, '準備中…');
      api('adm_updatePackage').then(function (d) {
        busy(el, false); downloadB64(d.name, d.base64, 'application/zip');
        toast('已下載 ' + d.name + '，解壓縮後依「請先讀我」更新');
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    licCheck: function (el) {
      busy(el, true, '驗證中…');
      var inp = document.getElementById('cs-授權金鑰');
      var key = inp ? inp.value : undefined;   // 用欄位上目前的金鑰驗證（未按儲存也可以）
      api('adm_checkLicense', key).then(function (v) {
        S.boot.license = v; S.st.settings.license = v;
        if (inp) S.st.settings.values['授權金鑰'] = key.toUpperCase().replace(/\s+/g, '');
        renderCompany(); renderLicBar();
        toast(v.ok ? '授權有效' + (v.mode === 'grace' ? '（離線寬限中）' : '') : v.message, !v.ok);
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    csSave: function (el) {
      var vals = {};
      Array.prototype.forEach.call(document.querySelectorAll('#st-body [data-key]'), function (x) { vals[x.dataset.key] = x.value; });
      busy(el, true, '儲存中…');
      api('adm_saveSettings', vals).then(function (d) {
        S.st.settings = d; renderCompany();
        var bad = d.license && d.license.enforced && !d.license.ok;
        toast(bad ? '已儲存，但' + d.license.message : '已儲存公司資料', bad);
        S.boot.company.name = d.values['公司名稱']; S.boot.company.netNote = d.values['實付備註']; S.boot.company.logo = d.logo;
        S.boot.company.color = d.values['填寫頁主色']; setBrand(d.values['填寫頁主色']);
        if (d.license) { S.boot.license = d.license; renderLicBar(); }
        renderSide(); setNav('settings');
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    mbAsk: function (el) { S.st.confirm = el.dataset.email; renderMembers(); },
    mbCancel: function () { S.st.confirm = ''; renderMembers(); },
    mbRemove: function (el) {
      busy(el, true);
      api('adm_removeMember', el.dataset.email).then(function (list) { S.st.members = list; S.st.confirm = ''; renderMembers(); toast('已移除 ' + el.dataset.email); }).catch(function (e) { busy(el, false); fail(e); });
    },
    mbAdd: function (el) {
      var em = $('#mb-email').value.trim(), nm = $('#mb-name').value.trim(), rl = $('#mb-role').value;
      busy(el, true);
      api('adm_saveMember', em, nm, rl).then(function (list) { S.st.members = list; renderMembers(); toast('已新增 ' + em + '，對方用公司帳號開啟後台網址即可登入'); }).catch(function (e) { busy(el, false); fail(e); });
    },
    lgLv: function (el) { S.st.level = el.dataset.v; updateLogs(); },
    lgOpen: function (el) { var k = el.dataset.k; S.st.open[k] = !S.st.open[k]; updateLogs(); }
  };
  var IN = {
    nfQ: function (el) { S.nf.q = el.value; S.nf.pid = null; updateNew(); },
    nfAmount: function (el) { S.nf.amount = el.value; updateNew(); },
    nfCat: function (el) { S.nf.cat = el.value; updateNew(); },
    nfIncomeDate: function (el) { S.nf.incomeDate = el.value; },
    nfPayDate: function (el) { S.nf.payDate = el.value; updateNew(); },
    nfNote: function (el) { S.nf.note = el.value; $('#nf-notelen').textContent = el.value.length + '/60'; },
    nfMemo: function (el) { S.nf.memo = el.value; },
    nfSend: function (el) { S.nf.send = el.value; updateNew(); },
    nbText: function (el) { S.nf.batchText = el.value; S.nf.batchPick = {}; updateBatch(); },
    nbPick: function (el) { S.nf.batchPick[el.dataset.i] = el.value; updateBatch(); },
    slQ: function (el) { S.sl.q = el.value; updateSlips(); },
    pyQ: function (el) { S.py.q = el.value; updatePayees(); },
    lgQ: function (el) { S.st.q = el.value; updateLogs(); },
    csColorPick: function (el) { ACT.csColor({ dataset: { v: el.value.toUpperCase() } }); },
    csLogo: function (el) {
      var file = el.files && el.files[0];
      if (!file) return;
      shrinkImage(file, 600, 280 * 1024).then(function (url) {
        toast('上傳中…');
        return api('adm_uploadLogo', url);
      }).then(function (d) {
        S.st.settings = d; S.boot.company.logo = d.logo; renderCompany(); renderSide(); setNav('settings'); toast('已更新 Logo');
      }).catch(function (e) { fail(e && e.message ? e : { message: '無法讀取這張圖片，請改用 PNG 或 JPG。' }); });
    },
    mbRole: function (el) {
      api('adm_saveMember', el.dataset.email, el.dataset.name, el.value).then(function (list) { S.st.members = list; renderMembers(); toast(el.dataset.name + ' 的角色已改為 ' + el.value); })
        .catch(function (e) { renderMembers(); fail(e); });
    }
  };
  function shrinkImage(file, maxSide, maxBytes) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var im = new Image();
        im.onerror = reject;
        im.onload = function () {
          var k = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
          var cv = document.createElement('canvas');
          cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          var out = cv.toDataURL('image/png');
          if (out.length * 0.75 > maxBytes) {
            var cx = cv.getContext('2d'); var bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
            var b = bg.getContext('2d'); b.fillStyle = '#fff'; b.fillRect(0, 0, bg.width, bg.height); b.drawImage(cv, 0, 0);
            out = bg.toDataURL('image/jpeg', 0.85);
          }
          resolve(out);
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACT[el.dataset.act];
    if (fn) { if (el.tagName !== 'INPUT') e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset && IN[el.dataset.in] && el.type !== 'file' && el.tagName !== 'SELECT' && el.type !== 'radio' && el.type !== 'color') IN[el.dataset.in](el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset && IN[el.dataset.in] && (el.type === 'file' || el.tagName === 'SELECT' || el.type === 'radio' || el.type === 'color' || el.type === 'date')) IN[el.dataset.in](el, e);
  });

  /* ================= 啟動 ================= */
  function boot() {
    api('adm_bootstrap').then(function (d) {
      S.boot = d;
      setBrand(d.company.color);
      if (d.license && d.license.strict && !d.license.ok) return renderLicenseWall(d.license.message);
      renderSide();
      renderLicBar();
      go('dash');
    }).catch(function (e) {
      if (e && e.denied) renderDenied(e.message);
      else { renderDenied((e && e.message) || '無法載入後台'); }
    });
  }
  boot();
})();
</script>
