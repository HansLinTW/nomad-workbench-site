<body data-c="#0E6B5A">
<div class="app">
  <nav class="side" id="side" aria-label="主選單">
    <div class="brand"><b>Nomad<br>Workbench</b><span id="coName"></span></div>
  </nav>
  <main class="main"><div id="licbar"></div><div id="main"><div class="loading"><span class="spin"></span>載入中…</div></div></main>
</div>
<div id="toast" class="toast hide" role="status"><span id="toastMsg"></span><button type="button" data-act="closeToast" aria-label="關閉通知">×</button></div>

<script>
var MAX_AMOUNT = 9999999;
var CATEGORY_OPTIONS = ["50 薪資(兼職)","9A 執行業務","9B 稿費/講演","92 其他所得"];
function userError_(msg) {
  var e = new Error(msg);
  e.userFacing = true;
  return e;
}
function formatMoney_(n) {
  return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function pad2_(n) { return (n < 10 ? '0' : '') + n; }
function ymd_(v) {
  if (v === null || v === undefined || v === '') return '';
  if (Object.prototype.toString.call(v) === '[object Date]') {
    if (isNaN(v.getTime())) return '';
    if (typeof Utilities !== 'undefined') return Utilities.formatDate(v, tz_(), 'yyyy-MM-dd');
    return v.getFullYear() + '-' + pad2_(v.getMonth() + 1) + '-' + pad2_(v.getDate());
  }
  var m = String(v).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m ? m[1] + '-' + pad2_(Number(m[2])) + '-' + pad2_(Number(m[3])) : '';
}
function constValue_(consts, name, date) {
  var best = null;
  consts.forEach(function (c) {
    if (c.name === name && c.from <= date && (!best || c.from > best.from)) best = c;
  });
  if (!best) throw new Error('扣繳常數缺少「' + name + '」在 ' + date + ' 的值');
  return best.value;
}
function evalThreshold_(expr, consts, date) {
  expr = String(expr || '').replace(/[,，\s]/g, '').replace(/[×xX＊]/g, '*');
  if (expr === '') return 0;
  if (/^\d+(\.\d+)?$/.test(expr)) return Number(expr);
  var m = expr.match(/^([^*]+)\*(\d+(\.\d+)?)$/);
  if (m) return Math.round(constValue_(consts, m[1], date) * Number(m[2]));
  return constValue_(consts, expr, date);
}
function taxOf_(amount, rateBp) { return Math.floor(amount * rateBp / 10000); }
function suppOf_(base, rateBp) { return Math.floor((base * rateBp + 5000) / 10000); }
function condHolds_(rule, amount, threshold) {
  switch (rule.cond) {
    case '給付額>=': return amount >= threshold;
    case '給付額>': return amount > threshold;
    case '給付額<=': return amount <= threshold;
    case '給付額<': return amount < threshold;
    case '稅額>': return taxOf_(amount, rule.rateBp) > threshold;
    case '一律': return true;
    case '免扣': return true;
    default: throw new Error('規則 ' + rule.id + ' 的條件「' + rule.cond + '」無法辨識');
  }
}
function pickRule_(rules, consts, item, category, resident, date, amount) {
  var target = resident ? '居住者' : '非居住者';
  for (var i = 0; i < rules.length; i++) {
    var r = rules[i];
    if (r.item !== item) continue;
    if (date < r.from || date > r.to) continue;
    if (r.cats.indexOf(category) < 0) continue;
    if (r.target !== '全部' && r.target !== target) continue;
    var th = evalThreshold_(r.threshold, consts, date);
    if (condHolds_(r, amount, th)) return r;
  }
  return null;
}
function categoryCode_(text, fallback) {
  var s = String(text || '').trim().toUpperCase();
  var m = s.match(/^(50|9A|9B|92)/);
  if (m) return m[1];
  if (/稿費|講演|演講|版稅/.test(s)) return '9B';
  if (/執行業務/.test(s)) return '9A';
  if (/其他所得/.test(s)) return '92';
  if (/薪資|兼職/.test(s)) return '50';
  var f = String(fallback || '50').trim().toUpperCase().slice(0, 2);
  return ['50', '9A', '9B', '92'].indexOf(f) >= 0 ? f : '50';
}
function categoryLabel_(code) {
  for (var i = 0; i < CATEGORY_OPTIONS.length; i++) {
    if (CATEGORY_OPTIONS[i].indexOf(code + ' ') === 0) return CATEGORY_OPTIONS[i];
  }
  return code;
}
function suppExemptReason_(exemption, category, amount, nhiInsured, consts, date) {
  if (nhiInsured === false) return '未參加全民健保';
  var isPro = category === '9A' || category === '9B';
  switch (exemption) {
    case '在本公司投保': return category === '50' ? '在本公司投保' : '';
    case '無投保資格':
    case '低收入戶':
    case '職業工會投保': return exemption;
    case '專技人員自行執業': return isPro ? exemption : '';
    case '弱勢身分': return isPro && amount < constValue_(consts, '最低工資', date) ? '弱勢身分未達最低工資' : '';
    default: return '';
  }
}
function calcWithholding_(input, rules, consts) {
  var amount = Math.floor(Number(input.amount));
  if (!(amount >= 1 && amount <= MAX_AMOUNT)) throw userError_('所得金額須為 1 ~ ' + formatMoney_(MAX_AMOUNT) + ' 的整數。');
  var cat = input.category;
  var date = input.date;
  var resident = input.resident !== false;
  var notes = [];

  var taxRule = pickRule_(rules, consts, '所得稅', cat, resident, date, amount);
  var tax = taxRule && taxRule.cond !== '免扣' ? taxOf_(amount, taxRule.rateBp) : 0;

  var supp = 0, suppRule = null;
  var reason = suppExemptReason_(input.exemption || '', cat, amount, input.nhiInsured, consts, date);
  if (reason) {
    notes.push('補充保費免扣：' + reason);
  } else {
    suppRule = pickRule_(rules, consts, '補充保費', cat, resident, date, amount);
    if (suppRule && suppRule.cond !== '免扣') {
      var base = suppRule.cap ? Math.min(amount, suppRule.cap) : amount;
      supp = suppOf_(base, suppRule.rateBp);
    }
  }

  return {
    category: cat,
    resident: resident,
    date: date,
    amount: amount,
    tax: tax,
    taxRateBp: taxRule ? taxRule.rateBp : 0,
    taxRule: taxRule ? taxRule.id : '',
    supp: supp,
    suppRateBp: suppRule ? suppRule.rateBp : 0,
    suppRule: suppRule ? suppRule.id : '',
    net: amount - tax - supp,
    ruleText: cat + (resident ? '・居住者' : '・非居住者') + '・' + date.slice(0, 4) + '｜' +
      (taxRule ? taxRule.id : '無') + ' / ' + (suppRule ? suppRule.id : (reason ? '免扣' : '無')),
    notes: notes
  };
}
</script>
<script>
(function () {
  'use strict';
  /* 主色：由公司設定的色碼推出深色與淡色，整頁一致 */
  function setBrand(hex) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return;
    var n = parseInt(hex.slice(1), 16), rgb = [n >> 16 & 255, n >> 8 & 255, n & 255];
    var mix = function (t, w) { return 'rgb(' + rgb.map(function (c) { return Math.round(c * (1 - w) + t * w); }).join(',') + ')'; };
    var R = document.documentElement.style;
    R.setProperty('--c', hex); R.setProperty('--c2', mix(0, .2));
    R.setProperty('--tint', mix(255, .88)); R.setProperty('--tint2', mix(255, .95)); R.setProperty('--cdark', mix(0, .35));
  }
  setBrand(document.body.getAttribute('data-c'));

  /* ================= 共用 ================= */
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var menuPath = function (item) { return '「' + ((S.boot && S.boot.product) || 'Nomad Workbench') + ' › ' + item + '」'; };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

      '<button type="button" class="kpi" data-act="go" data-to="slips" data-tab="signed"><span class="k">已簽署，待撥款</span><span class="v">' + k.signed + '<small>張</small></span><span class="small muted">實付合計 <span class="num">NTD ' + fmt(k.signedNet) + '</span></span></button>' +
      '<button type="button" class="kpi" data-act="go" data-to="slips" data-tab="paid"><span class="k">本月已撥款</span><span class="v">' + fmt(k.paidMonthNet) + '</span><span class="small muted">' + k.paidMonth + ' 張 · 實付金額（NTD）</span></button>' +
      '<button type="button" class="kpi" data-act="go" data-to="slips" data-tab="draft"><span class="k">草稿</span><span class="v">' + k.drafts + '<small>張</small></span><span class="small muted">尚未發送給所得人</span></button>' +
      '</section>' + crmHtml +
      '<div class="cols"><div class="grow" style="display:flex;flex-direction:column;gap:20px">' +
      '<section class="card" aria-labelledby="todo-h"><h2 id="todo-h" style="margin-bottom:4px">需要處理</h2><div class="list">' + todos + '</div></section>' +
      '<section class="card" aria-labelledby="sum-h"><div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px"><h2 id="sum-h">' + Number(d.month.slice(5)) + ' 月扣繳彙總</h2><span class="small muted">已簽署與已撥款的單據，依預計撥款日歸月</span></div>' +
      (sumRows ? '<div class="tblw"><table class="t"><thead><tr><th>所得類別</th><th class="r">張數</th><th class="r">給付總額</th><th class="r">補充保費</th><th class="r">所得稅</th></tr></thead><tbody>' + sumRows +
        '<tr style="font-weight:600"><td>合計</td><td class="r num">' + tot.n + '</td><td class="r num">' + fmt(tot.amount) + '</td><td class="r num">' + fmt(tot.supp) + '</td><td class="r num">' + fmt(tot.tax) + '</td></tr></tbody></table></div>'
        : '<p class="muted" style="margin:0">本月尚無已簽署的單據。</p>') +
      '<p class="small muted" style="margin:12px 0 0">所得稅應於次月 10 日前繳納；補充保費應於次月底前繳納。</p></section></div>' +
      '<section class="card side2" aria-labelledby="feed-h"><h2 id="feed-h" style="margin-bottom:4px">最近動態</h2><ol style="list-style:none;margin:0;padding:0">' + act + '</ol></section></div></div>';
  }

  /* ================= 開單 ================= */
  function viewNew(opt) {
    if (!S.nf || opt.reset) S.nf = freshNF();
    var f = S.nf;
    if (opt.pid || opt.name) {
      var p = opt.pid ? S.boot.payees.filter(function (x) { return x.pid === opt.pid; })[0] : null;
      S.nf = freshNF(); f = S.nf;
      if (p) { f.pid = p.pid; f.q = p.name; } else if (opt.name) { f.q = opt.name; }   // 還沒有所得人資料的往來對象：先帶入姓名
    }
    if (opt.edit) {
      var s = opt.edit;
      S.nf = freshNF(); f = S.nf;
      f.editId = s.id; f.q = s.name; f.pid = s.pid || null; f.amount = String(s.amount); f.cat = s.catSet ? s.cat : '';
      f.incomeDate = s.incomeDate; f.payDate = s.payDate; f.note = s.note; f.memo = s.memo; f.caseId = s.caseId || '';
    }
    if (opt.caseId && !opt.edit) { if (!(opt.pid || opt.name)) { S.nf = freshNF(); f = S.nf; } f.caseId = opt.caseId; }
    renderNew();
  }
  function renderNew() {
    var f = S.nf;
    var tabs = f.editId ? '' :
      '<div class="tabs" role="group" aria-label="開單方式"><button type="button" data-act="nfTab" data-v="single" class="' + (f.tab === 'single' ? 'on' : '') + '" aria-pressed="' + (f.tab === 'single') + '">單筆開單</button>' +
      '<button type="button" data-act="nfTab" data-v="batch" class="' + (f.tab === 'batch' ? 'on' : '') + '" aria-pressed="' + (f.tab === 'batch') + '">從 Excel 貼上多筆</button></div>';
    var head = '<header class="hd"><div><h1>' + (f.editId ? '修改草稿 <span class="num" style="font-size:20px">' + esc(f.editId) + '</span>' : '開單') + '</h1>' +
      '<p class="sub">輸入所得人與金額，系統即時試算並發送填寫連結</p></div>' + tabs + '</header>';
    var body;
    if (f.tab === 'batch') body = batchMarkup();
    else if (f.result) body = doneMarkup(f.result);
    else body = formMarkup();
    MAIN.innerHTML = '<div class="wrap">' + head + body + '</div>';
    if (f.tab === 'single' && !f.result) updateNew();
    if (f.tab === 'single' && f.result && f.result.link && !f.result.emailed) drawQr($('#qr-done'), f.result.link);
    if (f.tab === 'batch') { updateBatch(); drawBatchQrs(); }
  }
  function formMarkup() {
    var f = S.nf, d = S.boot.defCat;
    var catOpts = [['', '預設：' + categoryLabel_(d)], ['50', '50 薪資（兼職）'], ['9A', '9A 執行業務'], ['9B', '9B 稿費／講演'], ['92', '92 其他所得']].map(function (o) {
      return '<option value="' + o[0] + '"' + (f.cat === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('');
    return '<div class="cols">' +
      '<section class="card grow" aria-label="單據內容" style="display:flex;flex-direction:column;gap:18px;padding:24px">' +
      '<div class="field"><label for="nf-q">所得人姓名 <span style="color:var(--bad)">*</span></label>' +
      '<input id="nf-q" type="text" autocomplete="off" data-in="nfQ" value="' + esc(f.q) + '" placeholder="輸入姓名，系統會比對所得人主檔" maxlength="30">' +
      '<div id="nf-who" style="display:flex;flex-direction:column;gap:8px"></div></div>' +
      '<div class="grid">' +
      '<div class="field"><label for="nf-amt">所得金額（NTD）<span style="color:var(--bad)">*</span></label><input id="nf-amt" type="text" inputmode="numeric" class="num" style="font-size:16px" data-in="nfAmount" value="' + esc(f.amount) + '" placeholder="例如 25000"><span id="nf-amterr" class="xs" style="color:var(--bad)"></span></div>' +
      '<div class="field"><label for="nf-cat">所得類別 <span class="opt">（選填）</span></label><select id="nf-cat" data-in="nfCat">' + catOpts + '</select></div>' +
      '<div class="field"><label for="nf-idate">所得日期 <span class="opt">（選填）</span></label><input id="nf-idate" type="date" data-in="nfIncomeDate" value="' + esc(f.incomeDate) + '"></div>' +
      '<div class="field"><label for="nf-pdate">預計撥款日 <span class="opt">（選填）</span></label><input id="nf-pdate" type="date" data-in="nfPayDate" value="' + esc(f.payDate) + '"></div></div>' +
      '<div class="field"><div class="row" style="justify-content:space-between"><label for="nf-note" class="lbl">付款說明 <span class="opt" style="font-weight:400;color:var(--mute)">（選填，會出現在報酬單與檔名）</span></label><span class="xs muted" id="nf-notelen">' + f.note.length + '/60</span></div>' +
      '<input id="nf-note" type="text" maxlength="60" data-in="nfNote" value="' + esc(f.note) + '" placeholder="例如 10月品牌活動攝影"></div>' +
      '<div class="field"><label for="nf-memo">內部備註 <span class="opt">（選填，不印在報酬單）</span></label><input id="nf-memo" type="text" maxlength="200" data-in="nfMemo" value="' + esc(f.memo) + '"></div>' +
      caseField() +
      '<fieldset style="margin:0;padding:0;border:none;display:flex;flex-direction:column;gap:8px" id="nf-send"></fieldset>' +
      '<div class="row" style="justify-content:flex-end;padding-top:8px;border-top:1px solid var(--line2)" id="nf-btns"></div>' +
      '</section>' +
      '<aside class="card side2" aria-label="扣繳試算" id="nf-calc" style="display:flex;flex-direction:column;gap:14px"></aside></div>';
  }
  /* 開單掛案件（往來模組啟用、且有洽談中或進行中的案件時才出現） */
  function caseField() {
    var f = S.nf, list = (S.boot.cases || []).slice();
    if (f.caseId && !list.some(function (c) { return c.id === f.caseId; })) list.unshift({ id: f.caseId, name: '（目前的案件）', client: '' });
    if (!list.length) return '';
    return '<div class="field"><label for="nf-case">案件 <span class="opt">（選填，費用會算進這個案件）</span></label><select id="nf-case" data-in="nfCase"><option value="">不指定案件</option>' +
      list.map(function (c) { return '<option value="' + esc(c.id) + '"' + (f.caseId === c.id ? ' selected' : '') + '>' + esc(c.id + '｜' + c.name + (c.client ? '（' + c.client + '）' : '')) + '</option>'; }).join('') + '</select></div>';
  }
  function nfState() {
    var f = S.nf, P = S.boot.payees;
    var q = f.q.trim();
    var picked = f.pid ? P.filter(function (p) { return p.pid === f.pid; })[0] : null;
    var nq = q.replace(/\s+/g, '').toLowerCase();
    var matches = !picked && nq ? P.filter(function (p) { return p.name.replace(/\s+/g, '').toLowerCase().indexOf(nq) >= 0; }).slice(0, 12) : [];
    var exact = matches.filter(function (p) { return p.name.replace(/\s+/g, '').toLowerCase() === nq; });
    var amt = String(f.amount).replace(/[,\s]/g, '');
    var amount = /^\d+$/.test(amt) && Number(amt) >= 1 && Number(amt) <= MAX_AMOUNT ? Number(amt) : null;
    return { q: q, picked: picked, matches: matches, exact: exact, amount: amount, needPick: !picked && exact.length > 0 };
  }
  function calcFor(amount, cat, payee, date) {
    var input = {
      amount: amount, category: cat || S.boot.defCat, date: date || S.boot.today,
      resident: payee ? payee.resident : true, exemption: payee ? payee.exemption : '', nhiInsured: payee ? payee.nhi : true
    };
    var r = calcWithholding_(input, S.boot.rules, S.boot.consts);
    var ruleNote = function (id) { var x = S.boot.rules.filter(function (z) { return z.id === id; })[0]; return x ? x.note : ''; };
    r.reasons = [
      '所得稅：' + (r.taxRule ? ruleNote(r.taxRule) : '未達扣繳門檻，免扣'),
      '補充保費：' + (r.notes.length ? r.notes.join('；').replace(/^補充保費/, '') : (r.suppRule ? ruleNote(r.suppRule) : '未達扣取門檻，免扣'))
    ];
    return r;
  }
  function updateNew() {
    var f = S.nf, st = nfState(), p = st.picked;
    $('#nf-q').classList.toggle('hide', !!p);
    var who = '';
    if (p) {
      who = '<div class="picked"><span style="font-weight:700;font-size:15px">' + esc(p.name) + '</span><span class="num small">' + esc(p.pid) + ' · ' + esc(p.idMask) + '</span>' +
        okChip(p.status, p.status === '資料完整') + (p.foreign ? '<span class="pill" style="background:#EEE9F6;color:#4A2F7A">外籍・' + (p.resident ? '已滿 183 天' : '非居住者') + '</span>' : '') +
        '<button type="button" class="btn sm" data-act="nfUnpick" style="margin-left:auto">更換</button></div>';
    } else if (st.matches.length) {
      who = '<div class="drop">' + (st.exact.length > 1 ? '<div class="note warn" style="border-radius:0">有 ' + st.exact.length + ' 位同名所得人，請依身分證與電話末碼選擇</div>' : '') +
        st.matches.map(function (m) {
          return '<button type="button" data-act="nfPick" data-pid="' + esc(m.pid) + '"><span style="font-weight:600;min-width:88px">' + esc(m.name) + '</span>' +
            '<span class="num small">' + esc(m.pid) + ' · ' + esc(m.idMask) + '</span><span class="small muted">電話末 3 碼 ' + esc(m.tel3 || '—') + '</span>' +
            '<span style="margin-left:auto">' + okChip(m.status, m.status === '資料完整') + '</span></button>';
        }).join('') + '</div>';
      if (st.needPick) who += '<span class="xs" style="color:var(--warn)">請從清單選擇所得人</span>';
      else who += '<div class="note info">沒有完全相同的姓名。若是新的所得人，直接填下去即可；身分證、地址、帳戶由所得人自行填寫。</div>';
    } else if (st.q) {
      who = '<div class="note info">主檔中沒有「' + esc(st.q) + '」。將以新所得人開單，身分證、地址、帳戶由所得人在填寫頁自行輸入，下次會自動帶入。</div>';
    }
    $('#nf-who').innerHTML = who;
    var amtBad = f.amount !== '' && st.amount === null;
    $('#nf-amt').classList.toggle('bad', amtBad);
    $('#nf-amterr').textContent = amtBad ? '請輸入 1 ~ ' + fmt(MAX_AMOUNT) + ' 的整數' : '';
    $('#nf-notelen').textContent = f.note.length + '/60';

    var hasEmail = !!(p && p.hasEmail);
    var send = f.send || (hasEmail ? 'email' : 'link');
    if (send === 'email' && !hasEmail) send = 'link';
    $('#nf-send').innerHTML = '<legend class="lbl" style="margin-bottom:6px;padding:0">發送方式</legend>' +
      '<label class="radio ' + (send === 'email' ? 'on' : '') + (hasEmail ? '' : ' off') + '"><input type="radio" name="nf-send" value="email" data-in="nfSend"' + (send === 'email' ? ' checked' : '') + (hasEmail ? '' : ' disabled') + '>' +
      '<span>寄 Email 給所得人 <span class="muted">' + (hasEmail ? '（' + esc(p.emailMask) + '）' : (p ? '（此所得人沒有 Email）' : '（新所得人尚無 Email）')) + '</span></span></label>' +
      '<label class="radio ' + (send === 'link' ? 'on' : '') + '"><input type="radio" name="nf-send" value="link" data-in="nfSend"' + (send === 'link' ? ' checked' : '') + '><span>產生連結與 QR Code，自行用 LINE 傳送</span></label>';
    f._send = send;

    var cant = !st.q || st.amount === null || st.needPick;
    var cantLic = cant || !licOk();   // 授權無效：不能開新單、不能發送；修改草稿不受影響
    $('#nf-btns').innerHTML = f.editId
      ? '<button type="button" class="btn lg" data-act="go" data-to="slips" data-sel="' + esc(f.editId) + '">取消</button>' +
        '<button type="button" class="btn lg" data-act="nfSubmit" data-send="0"' + (cant ? ' disabled' : '') + '>儲存修改</button>' +
        '<button type="button" class="btn pri lg" data-act="nfSubmit" data-send="1"' + (cantLic ? ' disabled' : '') + '>儲存並發送</button>'
      : '<button type="button" class="btn lg" data-act="nfSubmit" data-send="0"' + (cantLic ? ' disabled' : '') + '>存成草稿</button>' +
        '<button type="button" class="btn pri lg" data-act="nfSubmit" data-send="1"' + (cantLic ? ' disabled' : '') + '>建立並發送</button>';

    var c = null, err = '';
    try { c = calcFor(st.amount || 1, f.cat, p, f.payDate); } catch (e) { err = e.message; }
    var person = p ? (p.foreign ? p.name + '：外籍，' + (p.resident ? '今年在台已滿 183 天，視為居住者' : '以非居住者計算（今年未申報滿 183 天）') : p.name + '：本國居住者')
      : (st.q ? '新所得人：暫以本國居住者試算，所得人填寫身分後會重新計算' : '尚未選擇所得人：以本國居住者試算');
    var amtShown = st.amount || 0;
    $('#nf-calc').innerHTML = '<div class="row" style="justify-content:space-between;align-items:baseline"><h2>扣繳試算</h2><span class="xs muted">依 ' + esc(slash(f.payDate || S.boot.today)) + ' 適用規則</span></div>' +
      '<div class="small" style="padding:8px 10px;border-radius:8px;background:var(--bg);color:var(--ink2)">' + esc(person) + '</div>' +
      (err ? '<div class="note bad">' + esc(err) + '</div>' :
      '<dl class="sum"><div><dt>所得金額</dt><dd>' + fmt(amtShown) + '</dd></div><div><dt>扣繳健保補充保費</dt><dd>− ' + fmt(st.amount ? c.supp : 0) + '</dd></div>' +
      '<div><dt>預扣所得稅</dt><dd>− ' + fmt(st.amount ? c.tax : 0) + '</dd></div><div style="align-items:baseline;padding-top:12px"><dt style="font-weight:700">實付金額</dt><dd style="font-size:24px;font-weight:600">' + fmt(st.amount ? c.net : 0) + '</dd></div></dl>' +
      '<ul class="small" style="margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)">' +
      (st.amount ? c.reasons.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') : '<li>輸入金額後顯示適用規則</li>') + '</ul>') +
      (S.boot.company.netNote ? '<p class="xs muted" style="margin:0;padding-top:10px;border-top:1px solid var(--line2)">' + esc(S.boot.company.netNote) + '</p>' : '') +
      '<p class="xs muted" style="margin:0">最終金額以所得人送出時的身分（居住者、健保）重新計算為準。</p>';
  }
  function doneMarkup(r) {
    var how = r.emailed
      ? '<p style="margin:0">填寫連結已寄到 <b>' + esc(r.email) + '</b>，有效至 ' + esc(r.expire) + '。所得人簽署後，你和財務會收到通知。</p>'
      : (r.sent ? linkBox(r.link, r.expire, 'qr-done') : '<p style="margin:0">已存成草稿，可以到「單據」頁發送。</p>');
    return '<section class="card" style="display:flex;flex-direction:column;gap:16px;max-width:680px;padding:28px">' +
      '<div class="row" style="flex-wrap:nowrap;gap:12px"><span style="width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--c);display:flex;align-items:center;justify-content:center;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' +
      '<div><h2 style="font-size:19px">' + (S.nf.editId ? '已更新' : '已建立') + ' <span class="num">' + esc(r.id) + '</span></h2><p class="sub" style="margin:2px 0 0">' + esc(r.name) + ' · 所得 NTD ' + fmt(r.amount) + ' · 實付 NTD ' + fmt(r.net) + '</p></div></div>' +
      how + '<div class="row"><button type="button" class="btn pri lg" data-act="nfReset">再開一張</button><button type="button" class="btn lg" data-act="go" data-to="slips" data-sel="' + esc(r.id) + '">查看單據</button></div></section>';
  }

  /* --- 批次 --- */
  function batchMarkup() {
    var f = S.nf;
    var res = f.batchResult;
    var result = '';
    if (res) {
      var mailN = res.filter(function (r) { return r.emailed; }).length;
      result = '<div class="note ok"><b>已建立 ' + res.length + ' 張。</b>' + mailN + ' 張已寄 Email；' + (res.length - mailN) + ' 張請把下方連結傳給所得人。</div>' +
        '<div class="tblw"><table class="t"><thead><tr><th>單號</th><th>所得人</th><th class="r">實付</th><th>發送</th></tr></thead><tbody>' +
        res.map(function (r, i) {
          return '<tr><td class="num">' + esc(r.id) + '</td><td>' + esc(r.name) + '</td><td class="r num">' + fmt(r.net) + '</td><td>' +
            (r.emailed ? '已寄到 ' + esc(r.email) : '<div class="row" style="flex-wrap:nowrap"><input type="text" readonly class="mono" style="font-size:12px;min-height:36px" value="' + esc(r.link) + '" id="bl-' + i + '" aria-label="' + esc(r.name) + ' 的填寫連結"><button type="button" class="btn sm out" data-act="copy" data-in="bl-' + i + '">複製</button></div>') +
            '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="row"><button type="button" class="btn lg" data-act="nfBatchAgain">再貼一批</button><button type="button" class="btn pri lg" data-act="go" data-to="slips">查看單據</button></div>';
      return '<section class="card" style="display:flex;flex-direction:column;gap:16px;padding:24px">' + result + '</section>';
    }
    return '<section class="card" style="display:flex;flex-direction:column;gap:16px;padding:24px">' +
      '<div class="field"><label for="nb-text">從 Excel 複製後貼上</label><span class="small muted">每列一張單，欄位依序為：姓名、所得金額、所得類別（選填：50／9A／9B／92）、付款說明（選填）</span>' +
      '<textarea id="nb-text" rows="6" class="mono" style="font-size:13px;tab-size:12" data-in="nbText" placeholder="王小明	5000	9A	11月攝影追加">' + esc(f.batchText) + '</textarea></div>' +
      '<div id="nb-table"></div><div id="nb-foot" class="row" style="justify-content:space-between;gap:12px"></div></section>';

    return new Promise(function (resolve, reject) {

        im.onerror = reject;

          var k = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
          var cv = document.createElement('canvas');
          cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          var out = cv.toDataURL('image/png');
          if (out.length * 0.75 > maxBytes) {
            var cx = cv.getContext('2d'); var bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
            var b = bg.getContext('2d'); b.fillStyle = '#fff'; b.fillRect(0, 0, bg.width, bg.height); b.drawImage(cv, 0, 0);
            out = bg.toDataURL('image/jpeg', 0.85);
          }
          resolve(out);
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });

      if (WB.hooks.prefetch) setTimeout(WB.hooks.prefetch, 50);   // 背景先載入往來資料，點進去就不用等
    }).catch(function (e) {
      if (e && e.denied) renderDenied(e.message);
      else { renderDenied((e && e.message) || '無法載入後台'); }
    });
  }
  setTimeout(boot, 0);   // 讓後面載入的模組（往來）先註冊畫面
})();
</script>

<script>
(function () {
  'use strict';

  var svg = WB.svg, loading = WB.loading, has = WB.has, S = WB.S;
  var M = function () { return WB.main(); };
  /** 後台金額以含稅為主：資料庫存未稅，顯示時乘上營業稅率 */
  function gr(n) { n = Number(n); return n > 0 ? Math.round(n * (1 + ((C.boot && C.boot.taxRate) || 0) / 100)) : 0; }

  /* ================= 狀態與資料快取 ================= */
  var C = S.crm = {
    boot: null, parties: null, cases: null,
    pl: { q: '', type: '', role: '', tag: '', status: '', owner: '', month: '', monthIds: null, checked: {}, limit: 300 },
    cl: { tab: 'open', q: '', owner: '', month: '', monthIds: null },
    nl: { tab: 'all', q: '', type: '', month: '', data: null },

  /* 載入：第一次用 adm_crm_all 一次取回全部清單；之後只重抓有變動的那一份 */
  var allP = null;

    if (!C.boot) {
      if (!allP) allP = api('adm_crm_all').then(function (d) { C.boot = d.boot; C.parties = d.parties; if (d.cases) C.cases = d.cases; allP = null; }, function (e) { allP = null; throw e; });
      return allP;
    }
    var jobs = [];
    if (!C.parties) jobs.push(api('adm_crm_parties').then(function (l) { C.parties = l; }));
    if (has('case.view') && !C.cases) jobs.push(api('adm_crm_cases').then(function (l) { C.cases = l; }));

  }
  function reload(what) {
    if (what === 'parties' || what === true) C.parties = null;
    if (what === 'cases' || what === true) C.cases = null;
    if (what === 'boot') C.boot = null;
    return load();
  }
  WB.hooks.prefetch = function () { if (has('crm.view')) load().catch(function () { /* 背景載入失敗時，點進去會再試 */ }); };
  var byId = function (id) { return (C.parties || []).filter(function (p) { return p.id === id; })[0]; };
  var caseById = function (id) { return (C.cases || []).filter(function (c) { return c.id === id; })[0]; };
  var memberName = function (em) {
    if (!em) return '';
    var m = (C.boot && C.boot.members || []).filter(function (x) { return x.email === em; })[0];
    return m ? m.name : em.split('@')[0];
  };
  var tagOf = function (id) { return (C.boot && C.boot.tags || []).filter(function (t) { return t.id === id; })[0]; };
  function tagChip(id) {
    var t = tagOf(id);
    if (!t) return '';
    return '<span class="tg' + (t.off ? ' off' : '') + '" style="background:' + esc(t.color) + '1A;color:' + esc(t.color) + '" title="' + esc(t.group ? t.group + '／' + t.name : t.name) + '"><i style="background:' + esc(t.color) + '"></i>' + esc(t.name) + '</span>';
  }
  var ROLE_C = { '客戶': ['#E3F1EC', '#0A4F42'], '廠商': ['#FBF0DC', '#6B4100'], '接案人員': ['#E4ECF7', '#1D3F73'], '媒體・KOL': ['#F7E6F0', '#7A2457'] };
  var roleChip = function (r) { var c = ROLE_C[r] || ['#EEF1EF', '#3D4844']; return '<span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(r) + '</span>'; };
  var CASE_C = { '洽談': ['#E4ECF7', '#1D3F73'], '進行中': ['#E3F1EC', '#0A4F42'], '已結案': ['#EEE9F6', '#4A2F7A'], '取消': ['#EEF1EF', '#5B6661'] };
  var caseChip = function (s) { var c = CASE_C[s] || ['#EEF1EF', '#3D4844']; return '<span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(s) + '</span>'; };
  var NOTE_IC = { '訊息': 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z', '電話': 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2', 'Email': 'M4 6h16v12H4zM4 7l8 6 8-6',
    '會議': 'M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 20v-2a4 4 0 0 0-3-3.9', '拜訪': 'M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4', '工作進度': 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9', '其他': 'M5 12h.01M12 12h.01M19 12h.01' };
  var icon = function (d, size) { return '<svg width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; };
  var back = function (to, label) { return '<div style="margin-bottom:-8px"><button type="button" class="link" style="font-family:inherit;font-weight:500;text-decoration:none" data-act="go" data-to="' + to + '">← ' + esc(label) + '</button></div>'; };
  var SOCIALS = [['fb', 'Facebook', '網址或粉專名稱'], ['ig', 'Instagram', '@帳號或網址'], ['threads', 'Threads', '@帳號或網址'], ['yt', 'YouTube', '頻道網址或 @帳號'], ['tiktok', 'TikTok', '@帳號或網址'], ['linkedin', 'LinkedIn', '網址']];
  /** 帳號轉成網址；本來就是網址就直接用 */
  function socialUrl(k, v) {

    var h = v.replace(/^@/, '');

  }
  var opt = function (v, label, cur) { return '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + esc(label) + '</option>'; };

  function guard(p) { return p.catch(function (e) { fail(e); M().innerHTML = '<div class="wrap"><p class="muted">無法載入。</p></div>'; }); }

  /* ================= 公司在上、旗下的人縮排在下 ================= */
  /**
   * rows：符合條件的列；o.id(r)、o.company(r)（所屬公司編號）、o.isCo(r)、o.parent(id)（公司的完整資料，可能不在 rows 裡）、
   * o.cmpG(g1, g2)、o.cmpR(r1, r2)。回傳 { groups:[{id, co, ctx, kids}], loose:[個人] }
   * ctx = 公司本身不符合篩選，只是因為旗下有人符合而帶出來當標題。
   */
  function buildGroups(rows, o) {
    var match = {}, G = {}, list = [], loose = [];
    rows.forEach(function (r) { match[o.id(r)] = true; });
    var grp = function (id) { return G[id] || (list.push(G[id] = { id: id, co: null, ctx: false, kids: [] }), G[id]); };
    rows.forEach(function (r) {
      if (o.isCo(r)) { var g0 = grp(o.id(r)); g0.co = r; return; }
      var cid = o.company(r), par = cid ? o.parent(cid) : null;
      if (!par) { loose.push(r); return; }
      var g = grp(cid); g.kids.push(r);
      if (!g.co) { g.co = par; g.ctx = !match[cid]; }
    });
    list.forEach(function (g) { g.kids.sort(o.cmpR); });
    list.sort(o.cmpG); loose.sort(o.cmpR);
    return { groups: list, loose: loose };
  }
  /** 依筆數上限攤平成顯示順序；收合的公司不列旗下的人 */
  function flattenGroups(gr, limit, collapsed) {
    var out = [], n = 0, more = false;
    for (var i = 0; i < gr.groups.length; i++) {
      var g = gr.groups[i];
      if (n >= limit) { more = true; break; }
      out.push({ k: 'co', g: g });
      n += 1;
      if (!collapsed[g.id]) g.kids.forEach(function (r, j) { out.push({ k: 'kid', r: r, g: g, last: j === g.kids.length - 1 }); n++; });
    }
    if (gr.loose.length && !more) {
      if (gr.groups.length) out.push({ k: 'sep', n: gr.loose.length });
      for (var j = 0; j < gr.loose.length; j++) { if (n >= limit) { more = true; break; } out.push({ k: 'one', r: gr.loose[j], solo: !gr.groups.length }); n++; }
    } else if (gr.loose.length) more = true;
    return { items: out, more: more };
  }

  /* ================= 往來對象列表 ================= */
  WB.VIEWS.parties = function () {
    M().innerHTML = loading();
    guard(load().then(function () { if (S.view === 'parties') renderParties(); }));
  };
  function plRows() {
    var f = C.pl, q = f.q.trim().toLowerCase();
    return C.parties.filter(function (p) {
      if (f.type && p.type !== f.type) return false;
      if (f.role && p.roles.indexOf(f.role) < 0) return false;

      '<header class="hd"><div><h1>往來對象</h1><p class="sub">' + C.parties.length + ' 筆 · 公司 ' + co + '、個人 ' + (C.parties.length - co) + '</p></div><div class="row">' +
      (B.perms.edit ? '<button type="button" class="btn" data-act="go" data-to="importParties">從 Excel 匯入</button>' : '') +
      (B.perms.admin ? '<button type="button" class="btn" data-act="cpExport">匯出 CSV</button>' : '') +
      (B.perms.edit ? '<button type="button" class="btn pri lg" data-act="go" data-to="partyForm">' + svg('plus', 16) + '新增往來對象</button>' : '') + '</div></header>' +
      '<div class="flt" role="search">' +
      '<input type="search" aria-label="搜尋往來對象" placeholder="搜尋名稱、統編、Email、電話" data-in="cpQ" value="' + esc(f.q) + '">' +

      '<select aria-label="角色" data-in="cpF" data-k="role"><option value="">所有角色</option>' + B.opts.roles.map(function (x) { return opt(x, x, f.role); }).join('') + '</select>' +
      '<select aria-label="標籤" data-in="cpF" data-k="tag">' + tagOpts + '</select>' +
      '<select aria-label="狀態" data-in="cpF" data-k="status"><option value="">所有狀態</option>' + B.opts.status.map(function (x) { return opt(x, x, f.status); }).join('') + '</select>' +
      '<select aria-label="承辦人" data-in="cpF" data-k="owner"><option value="">所有承辦人</option>' + opt('-', '未指定', f.owner) + B.members.map(function (m) { return opt(m.email, m.name, f.owner); }).join('') + '</select>' +
      '<label class="row small" style="gap:6px"><span class="muted">月份往來</span><input type="month" aria-label="依月份篩選有往來的對象" data-in="cpMonth" value="' + esc(f.month) + '"></label>' +
      (f.month ? '<button type="button" class="btn sm" data-act="cpMonthClear">清除月份</button>' : '') + '</div>' +
      '<div id="cp-bulk"></div><section class="card flush"><div class="tblw" id="cp-table"></div></section></div>';
    updateParties();
  }
  function groups(tags) {
    var out = [], idx = {};
    tags.forEach(function (t) { var g = t.group || ''; if (!(g in idx)) { idx[g] = out.length; out.push({ name: g, tags: [] }); } out[idx[g]].tags.push(t); });
    return out;
  }
  function updateParties() {
    var f = C.pl, B = C.boot;

      parent: function (id) { var c = pmap[id]; return c && c.type === '公司' ? c : null; },
      cmpG: function (a, b) { return idx[a.id] - idx[b.id]; }, cmpR: function (a, b) { return idx[a.id] - idx[b.id]; }
    });
    var forceOpen = !!(f.q || f.type || f.role || f.tag || f.status || f.owner || f.month);

        '<span style="font-weight:600' + (o.co ? ';font-size:15px' : '') + '">' + esc(p.name) + '</span>' + (p.status !== '往來中' ? ' <span class="xs muted">（' + esc(p.status) + '）</span>' : '') +
        (o.cnt ? '<span class="cnt">' + o.cnt + '</span>' : '') + '<div class="small muted"' + (o.caret ? ' style="padding-left:20px"' : '') + '>' + esc(sub || (o.co ? '' : p.id)) + '</div></td>' +
        '<td><div class="row" style="gap:4px"><span class="small muted" style="margin-right:2px">' + esc(p.type) + '</span>' + p.roles.map(roleChip).join('') + '</div></td>' +

        '<td class="small">' + esc(memberName(p.owner) || '—') + '</td>' +

    };

      if (it.k === 'sep') return '<tr class="gsep"><td colspan="' + ncol + '">未隸屬公司的個人（' + it.n + ' 位）</td></tr>';

  /* ---------- 互動紀錄：用 Email 寄給客戶 ---------- */
  // 狀態放在 m = { on, targets, loading, sel: { email: true }, cc, files, key }；只重畫寄送區塊，不影響已選的附件檔
  function mailTargets(m, parties, caseId, done) {
    var key = parties.join(',') + '|' + (caseId || '');
    if (m.key === key && (m.targets || m.loading)) return;   // 已經有（或正在讀）這組收件人
    m.key = key; m.loading = true; m.err = '';
    api('adm_crm_noteMailTargets', parties, caseId || '').then(function (list) {
      if (m.key !== key) return;
      var first = !m.targets;
      m.targets = list; m.loading = false;
      var sel = {};
      list.forEach(function (t) { if (m.sel[t.email]) sel[t.email] = true; });
      if (first || !Object.keys(sel).length) {   // 預設勾選案件窗口；沒有窗口就全選
        var contacts = list.filter(function (t) { return t.contact; });
        (contacts.length ? contacts : list).forEach(function (t) { sel[t.email] = true; });
      }
      m.sel = sel;
      if (done) done();
    }).catch(function (e) { m.loading = false; m.targets = []; m.err = e && e.message; if (done) done(); });
  }
  function mailPanel(m, withFiles) {
    if (m.loading) return '<p class="small muted" style="margin:0"><span class="spin"></span>讀取收件人…</p>';
    var list = m.targets || [];
    if (m.err) return '<p class="small" style="margin:0;color:var(--bad)">' + esc(m.err) + '</p>';
    if (!list.length) return '<p class="small muted" style="margin:0">選取的往來對象與案件客戶都沒有 Email。請先在往來對象補上 Email，或加入有 Email 的聯絡人。</p>';
    var n = list.filter(function (t) { return m.sel[t.email]; }).length;
    return '<div class="ckl" role="group" aria-label="收件人">' + list.map(function (t) {
        var on = !!m.sel[t.email];
        return '<label class="' + (on ? 'on' : '') + '" style="align-items:flex-start"><input type="checkbox" data-in="nmPick" value="' + esc(t.email) + '"' + (on ? ' checked' : '') + '>' +
          '<span><b style="font-weight:600">' + esc(t.name) + '</b>' + (t.contact ? ' <span class="pill" style="background:#E3F1EC;color:#0A4F42">窗口</span>' : '') +
          (t.company || t.title ? '<span class="small muted">　' + esc([t.company, t.title].filter(String).join('・')) + '</span>' : '') +
          '<br><span class="small muted mono">' + esc(t.email) + '</span></span></label>';
      }).join('') + '</div>' +
      '<div class="row small" style="gap:18px;flex-wrap:wrap"><label class="row" style="gap:6px"><input type="checkbox" data-in="nmCc"' + (m.cc ? ' checked' : '') + ' style="width:16px;height:16px;accent-color:var(--c)">副本寄給我</label>' +
      (withFiles ? '<label class="row" style="gap:6px"><input type="checkbox" data-in="nmFiles"' + (m.files ? ' checked' : '') + ' style="width:16px;height:16px;accent-color:var(--c)">附上附件</label>' : '') +
      '<span class="muted">已選 ' + n + ' 人。信件以你的名義寄出，客戶回信會直接寄到你的信箱。</span></div>';
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      if (file.size > 4 * 1024 * 1024) return reject({ message: '「' + file.name + '」超過 4 MB。' });
      var fr = new FileReader();
      fr.onerror = function () { reject({ message: '無法讀取「' + file.name + '」。' }); };
      fr.onload = function () { resolve(fr.result); };
      fr.readAsDataURL(file);
    });
  }

  };
  I.pfSet = function (el) {
    var k = el.dataset.k, prev = C.form[k];
    C.form[k] = el.value;
    if (k === 'company' && C.form._origCompany !== null) {
      if (prev !== el.value) C.form.title = '';   // 換公司（或離職）：原職稱不適用於新公司，清空重填
      renderPartyForm();
    }
  };
  I.pfSocial = function (el) { C.form.social = C.form.social || {}; C.form.social[el.dataset.k] = el.value; };
  I.pfList = function (el) {
    var list = C.form[el.dataset.k] = C.form[el.dataset.k] || [];
    var i = list.indexOf(el.value);
    if (el.checked && i < 0) list.push(el.value);
    if (!el.checked && i >= 0) list.splice(i, 1);
    el.closest('label').classList.toggle('on', el.checked);
  };
  I.ciText = function (el) { C.imp.text = el.value; C.imp.preview = null; };
  I.jbSet = function (el) { C.job[el.dataset.k] = el.value; };
  I.gpSet = function (el) { C.groupEdit.name = el.value; };
  I.tgColorPick = function (el) { C.tagEdit.color = el.value; };
  I.tgSet = function (el) { C.tagEdit[el.dataset.k] = el.value; };
  I.tgOff = function (el) { C.tagEdit.off = el.checked; };
  I.clQ = function (el) { C.cl.q = el.value; updateCases(); };
  I.clOwner = function (el) { C.cl.owner = el.value; updateCases(); };
  I.clType = function (el) { C.cl.type = el.value; updateCases(); };
  I.clTag = function (el) { C.cl.tagFilter = el.value; updateCases(); };
  I.clMonth = function (el) {
    C.cl.month = el.value;
    if (!el.value) { C.cl.monthIds = null; return renderCases(); }
    api('adm_crm_monthCases', el.value).then(function (ids) { C.cl.monthIds = ids; renderCases(); }).catch(fail);
  };
  I.cfSet = function (el) { C.form[el.dataset.k] = el.value; if (el.dataset.k === 'status' || el.dataset.k === 'due') renderCaseForm(); };
  I.cfIncl = function (el) {
    var f = C.form, r = 1 + (C.boot.taxRate || 0) / 100, on = el.checked, K = ['quote', 'budget', 'periodAmount', 'periodCost'];
    var val = function (k) { return Number(String(f[k] === undefined || f[k] === null ? '' : f[k]).replace(/[,\s]/g, '')); };
    f._conv = f._conv || {};
    K.forEach(function (k) {
      var n = val(k);
      if (!(n > 0)) return;
      // 只換算「從資料庫載入、還沒被改過」的金額；使用者剛打的數字照他打的意思處理（勾選前後都一樣）
      if (on && String(f[k]) === String((f._orig || {})[k])) { f[k] = String(Math.round(n * r)); f._conv[k] = f[k]; }
      else if (!on && f._conv[k] !== undefined && String(f[k]) === f._conv[k]) { f[k] = String(Math.round(n / r)); }
    });
    if (!on) f._conv = {};
    f.incl = on; renderCaseForm();
  };
  I.cfRenew = function (el) { C.form.autoRenew = el.checked; el.closest('.radio').classList.toggle('on', el.checked); };
  I.cfMedia = function (el) { C.form.mediaOn = el.checked; };
  I.cfTag = function (el) {
    var i = C.form.tags.indexOf(el.value);
    if (el.checked && i < 0) C.form.tags.push(el.value);
    if (!el.checked && i >= 0) C.form.tags.splice(i, 1);
    el.closest('label').classList.toggle('on', el.checked);
  };
  I.cmRole = function (el) { C.members[Number(el.dataset.i)].role = el.value; C.membersDirty = true; renderMemberList(); };
  I.cmContact = function (el) { C.members[Number(el.dataset.i)].contact = el.checked; C.membersDirty = true; renderMemberList(); };
  I.cmVia = function (el) {
    var m = C.members[Number(el.dataset.i)];
    m.via = el.value; m.viaName = el.value ? ((byId(el.value) || {}).name || '') : '';
    var added = ensureCompany(m.via, m.role);
    C.membersDirty = true; renderMemberList();
    if (added) toast('已一併加入「' + m.viaName + '」。');
  };
  I.cmQ = function (el) { C.addMember.q = el.value; renderMemberDrop(); };
  I.cmNewRole = function (el) { C.addMember.role = el.value; };
  I.nlQ = function (el) { C.nl.q = el.value; updateNotes(); };
  I.nlType = function (el) { C.nl.type = el.value; updateNotes(); };
  I.nlMonth = function (el) { C.nl.month = el.value; WB.VIEWS.notes(); };
  I.ntSet = function (el) { C.note[el.dataset.k] = el.value; if (el.dataset.k === 'caseId' && C.note.mail && C.note.mail.on) renderNoteMail(); };
  // 寄送選項：新增／編輯表單（C.note.mail）或檢視畫面的「寄給客戶」（C.mailDlg）
  var mailState = function () { return document.getElementById('nm-body') ? C.mailDlg : (C.note && C.note.mail); };
  var mailRedraw = function () { if (document.getElementById('nm-body')) { $('#nm-body').innerHTML = mailPanel(C.mailDlg, C.noteView.fileList.some(function (f) { return !f.gone; })); } else renderNoteMail(); };
  I.nmOn = function (el) { C.note.mail.on = el.checked; renderNoteMail(); };
  I.nmPick = function (el) { var m = mailState(); if (el.checked) m.sel[el.value] = true; else delete m.sel[el.value]; mailRedraw(); };
  I.nmCc = function (el) { mailState().cc = el.checked; };
  I.nmFiles = function (el) { mailState().files = el.checked; };
  I.nfpQ = function (el) { pickDrop(el.value); };
})();
</script>

<script>
(function () {
  'use strict';
  var WB = window.WB;
  if (!WB || !WB.crm) return;
  var $ = WB.$, esc = WB.esc, fmt = WB.fmt, slash = WB.slash, api = WB.api, toast = WB.toast, fail = WB.fail, busy = WB.busy;
  var svg = WB.svg, loading = WB.loading, has = WB.has, S = WB.S, X = WB.crm;
  var M = function () { return WB.main(); };
  var A = WB.ACT, I = WB.IN;

  var C = S.acct = { list: null, tab: 'open', q: '', pays: null, ptab: 'all', pq: '', bill: null, pay: null, plan: null };
  var ST = { '未收': ['#FBF0DC', '#6B4100'], '未付': ['#FBF0DC', '#6B4100'], '部分收款': ['#E4ECF7', '#1D3F73'], '部分付款': ['#E4ECF7', '#1D3F73'],
    '逾期': ['#FBE7E5', '#7E1D18'], '已收': ['#E3F1EC', '#0A4F42'], '已付': ['#E3F1EC', '#0A4F42'], '預定': ['#EEE9F6', '#4A2F7A'], '作廢': ['#EEF1EF', '#5B6661'] };
  var stChip = function (s) { var c = ST[s] || ['#EEF1EF', '#3D4844']; return '<span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(s) + '</span>'; };
  var money = function (n) { return '<span class="num">' + fmt(n || 0) + '</span>'; };
  var num = function (v) { var n = Number(String(v == null ? '' : v).replace(/[,\s]/g, '')); return isFinite(n) ? Math.round(n) : 0; };
  var today = function () { return S.boot.today; };
  var addDays = function (ymd, n) { var d = new Date(ymd + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
  var isAR = function (t) { return t !== '應付'; };
  var word = function (t) { return isAR(t) ? '收' : '付'; };
  var partyOpts = function (cur, role) {
    var list = (X.C.parties || []).slice().sort(function (a, b) {
      var ra = role && a.roles.indexOf(role) >= 0 ? 0 : 1, rb = role && b.roles.indexOf(role) >= 0 ? 0 : 1;
      return ra - rb || a.name.localeCompare(b.name, 'zh-Hant');
    });
    return '<option value="">請選擇</option>' + list.map(function (p) { return X.opt(p.id, p.name + (p.type === '個人' && p.companyName ? '（' + p.companyName + '）' : ''), cur); }).join('');
  };
  var caseOpts = function (cur) {
    return '<option value="">不指定</option>' + (X.C.cases || []).filter(function (c) { return c.status !== '取消' || c.id === cur; }).map(function (c) { return X.opt(c.id, c.id + '｜' + c.name, cur); }).join('');
  };
  function refreshAfterChange() {
    C.list = null; C.pays = null;
    if (S.view === 'ar' || S.view === 'ap') return WB.VIEWS[S.view]();
    if (S.view === 'pays') return WB.VIEWS.pays();
    if (S.view === 'case' && WB.hooks.caseShown && X.C.pcase) return WB.hooks.caseShown(X.C.pcase);
    if (S.view === 'party' && WB.hooks.partyShown && X.C.party) return WB.hooks.partyShown(X.C.party);
    if (S.view === 'dash') return WB.go('dash');
  }

  /* ================= 應收、應付清單 ================= */
  var TABS = [['open', '未結清'], ['overdue', '逾期'], ['planned', '預定'], ['done', '已結清'], ['void', '作廢'], ['all', '全部']];
  function inTab(tab, b) {
    if (tab === 'all') return true;
    if (tab === 'void') return b.status === '作廢';
    if (tab === 'planned') return b.status === '預定';
    if (tab === 'overdue') return b.status === '逾期';
    if (tab === 'done') return b.status === '已收' || b.status === '已付';
    return b.open > 0 && b.status !== '預定' && b.status !== '作廢';
  }
  function billsView(type) {
    return function () {
      M().innerHTML = loading();
      C.type = type;
      X.guard(Promise.all([X.load(), api('adm_acct_bills', type)]).then(function (r) {
        C.list = r[1]; C.taxRate = r[1].taxRate; C.termDays = r[1].termDays;
        if (S.view === (type === '應付' ? 'ap' : 'ar')) renderBills();
      }));
    };
  }
  WB.VIEWS.ar = billsView('應收');
  WB.VIEWS.ap = billsView('應付');

  function allRows() {
    var d = C.list;
    return d.bills.concat((d.slips || []).map(function (s) { return Object.assign({ slip: true }, s); }));
  }
  function renderBills() {
    var d = C.list, t = d.type, ar = isAR(t), rows = allRows();
    var live = rows.filter(function (b) { return b.status !== '作廢' && b.status !== '預定'; });
    var sum = function (list) { return list.reduce(function (a, b) { return a + (b.open || 0); }, 0); };
    var overdue = live.filter(function (b) { return b.status === '逾期'; });
    var soon = live.filter(function (b) { return b.open > 0 && b.due && b.due >= today() && b.due <= addDays(today(), 30); });
    var planned = rows.filter(function (b) { return b.status === '預定'; });
    var counts = {};
    TABS.forEach(function (x) { counts[x[0]] = rows.filter(function (b) { return inTab(x[0], b); }).length; });
    var wh = (d.withholding || []).filter(function (w) { return w.deadline >= today(); });
    M().innerHTML = '<div class="wrap">' +
      '<header class="hd"><div><h1>' + (ar ? '應收帳款' : '應付帳款') + '</h1><p class="sub">' + (ar ? '向客戶收的錢：分期、定期服務會自動產生，也可以手動新增' : '要付給廠商與接案人員的錢；已簽署的勞報單會自動列入') + '</p></div>' +
      (has('acct.edit') ? '<div class="row"><button type="button" class="btn lg" data-act="acPayNew" data-type="' + (ar ? '收款' : '付款') + '">登記' + (ar ? '收款' : '付款') + '</button>' +
        '<button type="button" class="btn pri lg" data-act="acBillNew" data-type="' + esc(t) + '">' + svg('plus', 16) + '新增' + esc(t) + '</button></div>' : '') + '</header>' +
      '<section class="kpis" aria-label="摘要">' +
      '<button type="button" class="kpi" data-act="acTab" data-v="open"><span class="k">未' + word(t) + '合計</span><span class="v">' + fmt(sum(live)) + '<small>元</small></span><span class="small muted">' + live.filter(function (b) { return b.open > 0; }).length + ' 筆</span></button>' +
      '<button type="button" class="kpi" data-act="acTab" data-v="overdue"><span class="k">逾期</span><span class="v"' + (overdue.length ? ' style="color:var(--bad)"' : '') + '>' + fmt(sum(overdue)) + '<small>元</small></span><span class="small muted">' + overdue.length + ' 筆</span></button>' +
      '<button type="button" class="kpi" data-act="acTab" data-v="open"><span class="k">30 天內截止</span><span class="v">' + fmt(sum(soon)) + '<small>元</small></span><span class="small muted">' + soon.length + ' 筆</span></button>' +
      '<button type="button" class="kpi" data-act="acTab" data-v="planned"><span class="k">預定（尚未開立）</span><span class="v">' + fmt(planned.reduce(function (a, b) { return a + b.total; }, 0)) + '<small>元</small></span><span class="small muted">' + planned.length + ' 筆</span></button></section>' +
      (d.withheldYear && d.withheldYear.n ? '<div class="note info"><b>' + esc(d.withheldYear.year) + ' 年被代扣：</b>' + d.withheldYear.n + ' 筆勞報單、所得 <span class="num">' + fmt(d.withheldYear.gross) + '</span> 元，被扣所得稅 <span class="num">' + fmt(d.withheldYear.tax) + '</span> 元、補充保費 <span class="num">' + fmt(d.withheldYear.supp) + '</span> 元。被扣的所得稅可在申報綜合所得稅時抵繳。</div>' : '') +
      (wh.length ? '<div class="note info">' + wh.map(function (w) {
        return '<div><b>代扣款：</b>' + esc(w.month.replace('-', ' 年 ')) + ' 月撥款的勞報單代扣所得稅 <span class="num">' + fmt(w.tax) + '</span> 元、補充保費 <span class="num">' + fmt(w.supp) + '</span> 元，請於 ' + esc(slash(w.deadline)) + ' 前繳納。</div>';
      }).join('') + '</div>' : '') +
      '<section class="card flush"><div class="flt" style="padding:16px 18px 10px"><div class="chips" role="group" aria-label="狀態">' + TABS.map(function (x) {
        return '<button type="button" class="chipbtn' + (C.tab === x[0] ? ' on' : '') + '" aria-pressed="' + (C.tab === x[0]) + '" data-act="acTab" data-v="' + x[0] + '">' + x[1] + ' <span class="n">' + counts[x[0]] + '</span></button>';
      }).join('') + '</div><input type="search" aria-label="搜尋" placeholder="搜尋往來對象、說明、案件、發票號碼" data-in="acQ" value="' + esc(C.q) + '"></div>' +
      '<div class="tblw" id="ac-table"></div></section></div>';
    updateBills();
  }
  function updateBills() {
    var q = C.q.trim().toLowerCase(), t = C.list.type;
    var rows = allRows().filter(function (b) {
      if (!inTab(C.tab, b)) return false;
      return !q || (b.id + ' ' + b.partyName + ' ' + b.desc + ' ' + b.caseName + ' ' + (b.invNo || '')).toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) {
      if (C.tab === 'open' || C.tab === 'overdue') return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
      return a.issue < b.issue ? 1 : a.issue > b.issue ? -1 : 0;
    });
    var el = $('#ac-table');
    if (!el) return;
    el.innerHTML = rows.length ? '<table class="t stk ab" style="min-width:760px"><thead><tr><th>帳款</th><th>往來對象</th><th>開立／截止</th><th class="r">含稅金額</th><th class="r">未' + word(t) + '</th><th>狀態</th></tr></thead><tbody>' + rows.map(function (b) {
      var src = b.slip ? '<span class="pill" style="background:#E4ECF7;color:#1D3F73">勞報單</span> ' : b.source === '分期' ? '<span class="pill" style="background:#EEE9F6;color:#4A2F7A">分期</span> ' : b.source === '定期' ? '<span class="pill" style="background:#E3F1EC;color:#0A4F42">定期</span> ' : '';
      return '<tr class="rowbtn" data-act="' + (b.slip ? 'acSlip' : 'acBill') + '" data-id="' + esc(b.id) + '"><td><div class="row" style="gap:6px">' + src + '<b style="font-weight:600">' + esc(b.desc || '（未填說明）') + '</b></div>' +
        '<div class="small muted"><span class="num">' + esc(b.id) + '</span>' + (b.caseName ? '・' + esc(b.caseName) : '') + (b.invNo ? '・發票 <span class="num">' + esc(b.invNo) + '</span>' : '') + '</div></td>' +
        '<td>' + esc(b.partyName || '—') + '</td>' +
        '<td class="small num"><span class="ac-iss">' + esc(slash(b.issue)) + '<br></span>' + esc(slash(b.due)) + (b.overdueDays ? '<div style="color:var(--bad)">逾期 ' + b.overdueDays + ' 天</div>' : '') + '</td>' +

  function ohRate() { return C.taxRate === undefined ? 5 : C.taxRate; }
  /** 金額類型：incl 含稅（預設）／net 未稅／none 免營業稅（國外服務） */
  function ohNet(v) { var n = num(v.amount); return v.kind === 'incl' ? Math.round(n / (1 + ohRate() / 100)) : n; }
  function ohGross(v) { var n = num(v.amount); return v.kind === 'net' ? Math.round(n * (1 + ohRate() / 100)) : n; }
  I.ohKind = function (el) { ohKeep(); C.ohf.kind = el.value; ohForm(C.ohf); };
  function ohForm(v) {
    C.ohf = v;
    var cases = (X.C.cases || []).filter(function (c) { return c.status !== '取消'; });
    X.overlay('<div class="hdm"><h2 id="ovl-h">' + (v.id ? '編輯固定費用' : '新增固定費用') + '</h2><button type="button" class="xbtn" data-act="ovlClose" aria-label="關閉">×</button></div>' +
      '<div class="grid"><div class="field"><label for="oh-name">名稱 <span style="color:var(--bad)">*</span></label><input id="oh-name" type="text" maxlength="60" data-in="ohSet" data-k="name" value="' + esc(v.name) + '" placeholder="例如：Adobe CC、Notion、Google Workspace"></div>' +
      '<div class="field"><label for="oh-party">付款對象 <span class="opt">（選填）</span></label><select id="oh-party" data-in="ohSet" data-k="party">' + partyOpts(v.party, '廠商').replace('請選擇', '不指定') + '</select></div></div>' +
      '<div class="grid"><div class="field"><label for="oh-amt">金額（' + (v.kind === 'net' ? '未稅' : v.kind === 'none' ? '免營業稅' : '含稅') + '）<span style="color:var(--bad)">*</span></label><input id="oh-amt" type="text" inputmode="numeric" class="num" data-in="ohSet" data-k="amount" value="' + esc(v.amount ? fmt(v.amount) : '') + '">' +
        '<span class="xs muted">' + (v.kind === 'none' ? '國外服務（如美金帳單）沒有營業稅，含稅與未稅相同。' : num(v.amount) ? (v.kind === 'incl' ? '未稅 ' + fmt(ohNet(v)) : '含稅 ' + fmt(ohGross(v))) + ' 元（營業稅 ' + ohRate() + '%）' : '營業稅 ' + ohRate() + '%') + '</span></div>' +
      '<div class="field"><label for="oh-kind">金額類型</label><select id="oh-kind" data-in="ohKind">' + [['incl', '含稅（預設）'], ['net', '未稅'], ['none', '免營業稅（國外服務）']].map(function (x) { return X.opt(x[0], x[1], v.kind || 'incl'); }).join('') + '</select></div>' +
      '<div class="field"><label for="oh-cyc">週期</label><select id="oh-cyc" data-in="ohSet" data-k="cycle">' + ['每月', '每年'].map(function (x) { return X.opt(x, x === '每年' ? '每年（每月以 1/12 分攤）' : x, v.cycle); }).join('') + '</select></div></div>' +
      '<div class="grid"><div class="field"><label for="oh-from">起始月份</label><input id="oh-from" type="month" data-in="ohSet" data-k="from" value="' + esc(v.from) + '"></div>' +
      '<div class="field"><label for="oh-to">結束月份 <span class="opt">（還在用就留空）</span></label><input id="oh-to" type="month" data-in="ohSet" data-k="to" value="' + esc(v.to) + '"></div></div>' +
      '<div class="field"><label for="oh-m">分攤方式</label><select id="oh-m" data-in="ohMethod">' + Object.keys(OH_HELP).map(function (x) { return X.opt(x, x, v.method); }).join('') + '</select><span class="xs muted">' + esc(OH_HELP[v.method]) + '</span></div>' +
      (v.method === '指定比例' ? '<div class="field"><span class="lbl">指定案件與比例</span><table class="inv-lines"><tbody>' + v.shares.map(function (x, i) {
        return '<tr><td><select aria-label="案件" data-in="ohShare" data-i="' + i + '" data-k="case"><option value="">選擇案件</option>' + cases.map(function (c) { return X.opt(c.id, c.id + '｜' + c.name, x.case); }).join('') + '</select></td>' +
          '<td style="width:90px"><input type="text" inputmode="decimal" class="num" aria-label="比例" data-in="ohShare" data-i="' + i + '" data-k="pct" value="' + esc(x.pct) + '"></td><td>%</td>' +
          '<td><button type="button" class="xbtn" style="width:30px;height:30px" aria-label="移除" data-act="ohShareDel" data-i="' + i + '">×</button></td></tr>';
      }).join('') + '</tbody></table><button type="button" class="btn sm" style="align-self:flex-start" data-act="ohShareAdd">＋ 加一個案件</button></div>' : '') +
      '<div class="field"><label for="oh-note">備註 <span class="opt">（選填）</span></label><input id="oh-note" type="text" maxlength="300" data-in="ohSet" data-k="note" value="' + esc(v.note) + '"></div>' +
      (v.id ? '<label class="row small" style="gap:8px"><input type="checkbox" data-in="ohOff"' + (v.off ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--c)">停用（過去月份仍照原設定分攤；要停止請改填結束月份）</label>' : '') +
      '<div class="row" style="justify-content:space-between">' + (v.id ? '<button type="button" class="btn danger" data-act="ohDel">刪除</button>' : '<span></span>') +
      '<div class="row"><button type="button" class="btn" data-act="ovlClose">取消</button><button type="button" class="btn pri" data-act="ohSave">儲存</button></div></div>');
  }
  A.ohNew = function () { ohForm({ kind: 'incl', name: '', party: '', amount: '', cycle: '每月', from: today().slice(0, 7), to: '', method: '營收比例', shares: [], note: '' }); };
  A.ohEdit = function (el) {
    if (!has('acct.edit')) return;
    var v = C.oh.items.filter(function (x) { return x.id === el.dataset.id; })[0];
    if (v) {
      v = JSON.parse(JSON.stringify(v));
      // 已存的是未稅 amount 與含稅 gross：兩者相同 = 免營業稅；否則以含稅顯示
      if (v.gross === v.amount) v.kind = 'none'; else { v.kind = 'incl'; v.amount = v.gross; }
      ohForm(v);
    }
  };
  function ohKeep() { ['name', 'amount', 'note', 'from', 'to'].forEach(function (k) { var x = document.querySelector('[data-in="ohSet"][data-k="' + k + '"]'); if (x) C.ohf[k] = x.value; }); }
  I.ohSet = function (el) { C.ohf[el.dataset.k] = el.value; };
  I.ohOff = function (el) { C.ohf.off = el.checked; };
  I.ohMethod = function (el) { ohKeep(); C.ohf.method = el.value; if (el.value === '指定比例' && !C.ohf.shares.length) C.ohf.shares = [{ case: '', pct: '' }]; ohForm(C.ohf); };
  I.ohShare = function (el) { C.ohf.shares[Number(el.dataset.i)][el.dataset.k] = el.value; };
  A.ohShareAdd = function () { ohKeep(); C.ohf.shares.push({ case: '', pct: '' }); ohForm(C.ohf); };
  A.ohShareDel = function (el) { ohKeep(); C.ohf.shares.splice(Number(el.dataset.i), 1); ohForm(C.ohf); };
  A.ohSave = function (el) {
    var v = C.ohf;
    busy(el, true, '儲存中…');
    api('adm_acct_saveOverhead', { id: v.id, name: v.name, party: v.party, amount: String(ohNet(v) || ''), gross: String(ohGross(v) || ''), cycle: v.cycle, from: v.from, to: v.to, method: v.method,
      shares: v.shares.filter(function (x) { return x.case; }).map(function (x) { return { case: x.case, pct: Number(x.pct) }; }), note: v.note, off: !!v.off })
      .then(function () { X.closeOverlay(); toast('已儲存'); WB.VIEWS.oh(); }).catch(function (e) { busy(el, false); fail(e); });
  };
  A.ohDel = function (el) {
    if (!window.confirm('刪除「' + C.ohf.name + '」？過去月份的分攤也會一起消失。只是不再使用的話，請改填結束月份。')) return;
    busy(el, true);
    api('adm_acct_deleteOverhead', C.ohf.id).then(function () { X.closeOverlay(); toast('已刪除'); WB.VIEWS.oh(); }).catch(function (e) { busy(el, false); fail(e); });
  };

  /* ================= 案件頁：帳務區塊 ================= */
  WB.hooks.caseShown = function (d) {
    var el = $('#acct-case');
    if (!el) return;
    var pre = d.acct;
    d.acct = null;   // 之後重新整理帳務區塊（新增帳款等）要重讀
    (pre ? Promise.resolve(pre) : api('adm_acct_case', d.id)).then(function (f) {
      el = $('#acct-case');
      if (!el || !X.C.pcase || X.C.pcase.id !== d.id) return;
      var edit = has('acct.edit');
      var line = function (b) {
        return '<tr class="rowbtn" data-act="' + (b.source === '勞報單' ? 'acSlip' : 'acBill') + '" data-id="' + esc(b.id) + '"><td><b style="font-weight:600">' + esc(b.desc || b.id) + '</b><div class="xs muted"><span class="num">' + esc(b.id) + '</span>' + (b.partyName ? '・' + esc(b.partyName) : '') + '</div></td>' +
          '<td class="small num">' + esc(slash(b.status === '預定' ? b.issue : b.due)) + '</td><td class="ac-amt">' + fmt(b.source === '勞報單' ? b.gross : b.total) + '</td><td>' + stChip(b.status) + '</td></tr>';
      };
      var tbl = function (list, empty) {
        return list.length ? '<div class="tblw"><table class="t"><thead><tr><th>項目</th><th>日期</th><th class="r">含稅</th><th>狀態</th></tr></thead><tbody>' + list.map(line).join('') + '</tbody></table></div>' : '<p class="small muted" style="margin:0">' + empty + '</p>';
      };
      var rec = f.recurring;
      var recHtml = rec ? '<div class="note info" style="display:flex;flex-direction:column;gap:6px"><div>每期 <span class="num">' + fmt(gr(rec.amount)) + '</span> 元（含稅，未稅 ' + fmt(rec.amount) + '）會在每期開始日自動開立應收' + (rec.next ? '，下一期 ' + esc(slash(rec.next)) : '') + '。</div>' +
        (edit ? '<div class="row small" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="acRebuild">重新建立應收款</button>' + (d.due ? '<label class="row xs" style="gap:6px"><input type="checkbox" id="ac-rb-future" style="width:16px;height:16px;accent-color:var(--c)">連同之後各期一起建立（預定）</label>' : '') + '<span class="xs muted">金額或期間設定錯了、刪除舊帳款之後用。尚未收款的定期應收會先清掉再依目前設定重建，已收款的不動。</span></div>' : '') +
        (rec.missing.length ? '<div class="row small" style="gap:8px">有 ' + rec.missing.length + ' 期在帳務啟用前、尚未開立' + (edit ? '：<select id="ac-miss" aria-label="選擇期別" style="width:auto;min-height:36px">' + rec.missing.map(function (m) {
          return '<option value="' + m.n + '">第 ' + m.n + ' 期（' + esc(slash(m.from)) + '）</option>';
        }).join('') + '</select><button type="button" class="btn sm" data-act="acIssue">開立</button>' : '') + '</div>' : '') + '</div>' : '';
      var ar = f.ar.filter(function (b) { return b.status !== '作廢'; });
      var costs = f.ap.filter(function (b) { return b.status !== '作廢'; }).concat(f.slips);
      el.innerHTML = '<div class="row" style="justify-content:space-between"><h2>帳務</h2>' + (edit ? '<div class="row" style="gap:6px">' +
          (d.type === '專案' || !d.type ? '<button type="button" class="btn sm" data-act="acPlan">排分期</button>' : '') +
          '<button type="button" class="btn sm" data-act="acBillNew" data-type="應收" data-case="' + esc(d.id) + '">新增應收</button>' +
          '<button type="button" class="btn sm" data-act="acBillNew" data-type="應付" data-case="' + esc(d.id) + '">新增應付</button></div>' : '') + '</div>' +
        '<dl class="ac-sum"><div style="grid-column:1/-1"><dt>預期利潤（未稅）' + (f.expMargin !== null ? '（' + f.expMargin + '%）' : '') + '</dt><dd' + (f.expProfit < 0 ? ' class="neg"' : '') + ' style="font-size:22px">' + fmt(f.expProfit) + '</dd>' +
          '<div class="xs muted" style="margin-top:4px;font-family:inherit;font-weight:400">預期收入 ' + fmt(f.expRevenue) + '（已開立 ' + fmt(f.revenue) + '＋預定 ' + fmt(f.planned) + '）－預期成本 ' + fmt(f.expCost) + (f.budgetLeft ? '（含預算尚未用到的 ' + fmt(f.budgetLeft) + '）' : '') + (f.budget ? '' : '。未設預算成本，成本只含已發生與預定的') + '</div></div>' +
        '<div><dt>收入（未稅）</dt><dd>' + fmt(f.revenue) + '</dd></div><div><dt>成本（未稅）</dt><dd>' + fmt(f.cost) + '</dd></div>' +
        '<div><dt>已認列利潤（未稅）' + (f.margin !== null ? '（' + f.margin + '%）' : '') + '</dt><dd' + (f.profit < 0 ? ' class="neg"' : '') + '>' + fmt(f.profit) + '</dd></div>' +
        (f.overhead ? '<div><dt>分攤固定費用</dt><dd>' + fmt(f.overhead) + '</dd></div><div><dt>分攤後已認列利潤' + (f.marginAfter !== null ? '（' + f.marginAfter + '%）' : '') + '</dt><dd' + (f.profitAfter < 0 ? ' class="neg"' : '') + '>' + fmt(f.profitAfter) + '</dd></div>' : '') +
        (f.overhead ? '<div><dt>分攤後預期利潤</dt><dd' + (f.expProfitAfter < 0 ? ' class="neg"' : '') + '>' + fmt(f.expProfitAfter) + '</dd></div>' : '') + (f.planned ? '<div><dt>預定收入</dt><dd>' + fmt(f.planned) + '</dd></div>' : '') +
        '<div><dt>現金淨額（含稅，已收−已付）</dt><dd' + (f.cashNet < 0 ? ' class="neg"' : '') + '>' + fmt(f.cashNet) + '</dd></div>' +
        '<div><dt>已收／未收（含稅）</dt><dd style="font-size:14px">' + fmt(f.received) + '／' + fmt(f.receivable) + '</dd></div>' +
        '<div><dt>已付／未付（含稅）</dt><dd style="font-size:14px">' + fmt(f.paid) + '／' + fmt(f.payable) + '</dd></div></dl>' +
        (f.quote || f.budget ? '<p class="xs muted" style="margin:0">對照：報價 ' + fmt(gr(f.quote)) + '・預算成本 ' + fmt(gr(f.budget)) + (f.quote ? '・已排入應收 ' + Math.round((f.revenue + f.planned) / f.quote * 100) + '%' : '') + '（報價與預算為含稅；收入、成本、利潤為未稅，毛利才不會被營業稅墊高）</p>' : '') +
        recHtml +
        '<div><h3 style="margin:0 0 6px">應收</h3>' + tbl(ar, '還沒有應收帳款。' + (edit && (d.type === '專案' || !d.type) ? '可以用「排分期」一次建立訂金、期中款與尾款。' : '')) + '</div>' +
        '<div><h3 style="margin:0 0 6px">成本（應付與勞報單）</h3>' + tbl(costs, '還沒有成本。') + '</div>';
    }).catch(function (e) { var x = $('#acct-case'); if (x) x.innerHTML = '<h2>帳務</h2><p class="small muted" style="margin:0">' + esc(e && e.message || '無法載入') + '</p>'; });
  };

  /* ================= 往來對象頁：帳務區塊 ================= */
  WB.hooks.partyShown = function (d) {
    var el = $('#acct-party');
    if (!el) return;
    api('adm_acct_party', d.id).then(function (f) {
      el = $('#acct-party');
      if (!el) return;
      var edit = has('acct.edit'), cust = d.roles.indexOf('客戶') >= 0, vend = d.roles.indexOf('廠商') >= 0 || d.roles.indexOf('接案人員') >= 0;
      if (!cust && !vend && !f.receivable && !f.payable && !f.open.length) { el.remove(); return; }   // 只有媒體・KOL 角色、沒有金錢往來
      el.innerHTML = '<h2>帳務</h2><dl class="sum">' +
        (f.receivable || cust ? '<div><dt>未收</dt><dd>' + money(f.receivable) + (f.overdue ? ' <span class="small" style="color:var(--bad)">（逾期 ' + fmt(f.overdue) + '）</span>' : '') + '</dd></div>' : '') +
        (f.payable || vend ? '<div><dt>未付</dt><dd>' + money(f.payable) + '</dd></div>' : '') + '</dl>' +
        (f.open.length ? '<ul class="tl">' + f.open.slice(0, 6).map(function (b) {
          return '<li style="padding:8px 0"><div class="body"><div class="row" style="justify-content:space-between;gap:6px"><button type="button" class="link" style="font-family:inherit;text-align:left" data-act="' + (b.source === '勞報單' ? 'acSlip' : 'acBill') + '" data-id="' + esc(b.id) + '">' + esc(b.desc || b.id) + '</button>' + money(b.open) + '</div>' +
            '<div class="xs muted">' + esc(b.type) + '・截止 ' + esc(slash(b.due)) + ' ' + (b.status === '逾期' ? '<span style="color:var(--bad)">逾期</span>' : '') + '</div></div></li>';
        }).join('') + '</ul>' : '<p class="small muted" style="margin:0">沒有未結清的帳款。</p>') +
        (edit ? '<div class="row" style="gap:6px">' + (cust || f.receivable ? '<button type="button" class="btn sm" data-act="acPayNew" data-type="收款" data-party="' + esc(d.id) + '">登記收款</button>' : '') +
          (vend || f.payable ? '<button type="button" class="btn sm" data-act="acPayNew" data-type="付款" data-party="' + esc(d.id) + '">登記付款</button>' : '') + '</div>' : '');
    }).catch(function () { var x = $('#acct-party'); if (x) x.remove(); });
  };

  /* ================= 總覽：帳務區塊 ================= */
  WB.hooks.acctDash = function (a) {
    if (!a) return '';
    var rows = a.dueSoon.map(function (x) {
      return '<div class="row" style="padding:12px 0;gap:12px;align-items:flex-start;flex-wrap:nowrap"><span class="dot" style="background:' + (x.status === '逾期' ? '#A3261F' : '#B86E00') + '"></span>' +
        '<div style="flex:1 1 auto;min-width:0"><button type="button" class="link" style="font-family:inherit;font-weight:600;text-align:left" data-act="' + (x.source === '勞報單' ? 'acSlip' : 'acBill') + '" data-id="' + esc(x.id) + '">' + esc(x.type) + '・' + esc(x.partyName) + (x.desc ? '・' + esc(x.desc) : '') + '</button>' +
        '<div class="small muted">' + (x.status === '逾期' ? '<span style="color:var(--bad)">逾期 ' + x.overdueDays + ' 天</span>' : '截止 ' + esc(slash(x.due))) + '</div></div><span class="num" style="font-weight:600">' + fmt(x.open) + '</span></div>';
    }).join('') || '<p class="muted" style="margin:0;padding:12px 0">7 天內沒有截止的帳款。</p>';
    var wh = (a.withholding || []).filter(function (w) { return w.deadline >= today(); });
    return '<section class="kpis" aria-label="帳務概況">' +
      '<button type="button" class="kpi" data-act="go" data-to="ar"><span class="k">應收未收</span><span class="v">' + fmt(a.receivable) + '<small>元</small></span><span class="small muted">' + (a.overdueCount ? '<span style="color:var(--bad)">逾期 ' + a.overdueCount + ' 筆 ' + fmt(a.overdue) + ' 元</span>' : '沒有逾期') + '</span></button>' +
      '<button type="button" class="kpi" data-act="go" data-to="ap"><span class="k">應付未付</span><span class="v">' + fmt(a.payable) + '<small>元</small></span><span class="small muted">含已簽署未撥款的勞報單</span></button>' +
      '<button type="button" class="kpi" data-act="go" data-to="pays"><span class="k">本月收款／付款</span><span class="v" style="font-size:22px">' + fmt(a.receivedMonth) + '<small>／' + fmt(a.paidMonth) + '</small></span><span class="small muted">付款含勞報單撥款</span></button></section>' +
      (wh.length ? '<div class="note info">' + wh.map(function (w) { return '代扣款：' + esc(w.month.replace('-', ' 年 ')) + ' 月撥款的勞報單代扣所得稅 ' + fmt(w.tax) + ' 元、補充保費 ' + fmt(w.supp) + ' 元，請於 ' + esc(slash(w.deadline)) + ' 前繳納。'; }).join('<br>') + '</div>' : '') +
      '<section class="card" aria-labelledby="ac-h"><h2 id="ac-h">7 天內截止與逾期的帳款</h2><div class="list">' + rows + '</div></section>';
  };
})();
</script>

</body>
</html>
